<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <title>Buddemeier-Williams HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

      --gold: #eab308;
      --pink: #ec4899;
      --green: #10b981;
      --overdue: #ef4444;

      --person-Rose: #ec4899;
      --person-Coral: #f97316;
      --person-Amber: #eab308;
      --person-Gold: #eab308;
      --person-Emerald: #10b981;
      --person-Teal: #14b8a6;
      --person-Sky: #0ea5e9;
      --person-Indigo: #6366f1;
      --person-Violet: #ec4899;
      --person-Slate: #71717a;

      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 18px;
      --transition: 150ms ease;
    }

    html[data-theme="dark"] {
      --bg-base: #050505;
      --surface: #121214;
      --surface-2: #1a1a1d;
      --surface-strong: #202024;
      --surface-solid: #121214;

      --ink: #ffffff;
      --ink-2: #e4e4e7;
      --ink-muted: #a1a1aa;
      --ink-subtle: #71717a;

      --border: #232326;
      --border-strong: #303034;
      --hover: #1c1c1f;
      --scrim: rgba(0, 0, 0, 0.7);
    }

    html[data-theme="light"] {
      --bg-base: #f0f0f2;
      --surface: #f9f9fa;
      --surface-2: #eeeef0;
      --surface-strong: #e6e6e9;
      --surface-solid: #fbfbfc;

      --ink: #0a0a0a;
      --ink-2: #3f3f46;
      --ink-muted: #71717a;
      --ink-subtle: #a1a1aa;

      --border: #dcdce0;
      --border-strong: #c8c8cd;
      --hover: #eeeef0;
      --scrim: rgba(10, 10, 10, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      background: var(--bg-base);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
    input, textarea, select { font: inherit; color: inherit; }

    .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; }
    @media (min-width: 768px) { .app { padding: 32px 32px 60px; } }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050505;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .sync-status.syncing .sync-dot { background: var(--gold); }
    .sync-status.error .sync-dot { background: var(--overdue); }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink-2);
      transition: var(--transition);
    }
    .icon-btn:hover { background: var(--hover); border-color: var(--border-strong); }
    .icon-btn svg { width: 17px; height: 17px; }
    html[data-theme="dark"] .icon-sun { display: block; }
    html[data-theme="dark"] .icon-moon { display: none; }
    html[data-theme="light"] .icon-sun { display: none; }
    html[data-theme="light"] .icon-moon { display: block; }

    /* Page toggle */
    .page-toggle {
      display: inline-flex;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .page-toggle::-webkit-scrollbar { display: none; }
    .page-toggle button {
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .page-toggle button.active { color: #050505; background: var(--gold); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .card + .card { margin-top: 14px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
    .card-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title-count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--ink-2);
    }
    .card-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat {
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--stat-color, var(--ink));
      border-radius: 10px;
    }
    .stat-num { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; color: var(--stat-color, var(--ink)); }
    .stat-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
    .streak-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .streak-pill {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
      font-size: 12px; color: var(--ink-2);
    }
    .streak-pill-num { font-family: var(--font-display); font-weight: 700; color: var(--gold); }

    /* Filter chips */
    .filter-row { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .chip:hover { color: var(--ink); border-color: var(--border-strong); }
    .chip.active { color: #050505; background: var(--gold); border-color: var(--gold); }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--ink-muted)); }

    /* Buckets */
    .buckets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 560px) { .buckets-grid { grid-template-columns: 1fr; } }
    .bucket { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .bucket-overdue { border-left: 3px solid var(--overdue); }
    .bucket-today { border-left: 3px solid var(--gold); }
    .bucket-week { border-left: 3px solid var(--green); }
    .bucket-later { border-left: 3px solid var(--border-strong); }
    .bucket-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
    .bucket-title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-muted); font-weight: 600; }
    .bucket-overdue .bucket-title { color: var(--overdue); }
    .bucket-today .bucket-title { color: var(--gold); }
    .bucket-week .bucket-title { color: var(--green); }
    .bucket-count { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; background: var(--surface-strong); border-radius: 999px; color: var(--ink-2); }
    .task-mini {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      align-items: center;
      transition: var(--transition);
    }
    .task-mini:hover { border-color: var(--border-strong); }
    .task-mini-check {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); flex-shrink: 0;
    }
    .task-mini-check:hover { border-color: var(--gold); }
    .task-mini-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }
    .task-mini-title { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-mini-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
    .task-mini.overdue .task-mini-meta-due { color: var(--overdue); font-weight: 600; }
    .task-mini-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; font-family: var(--font-display);
      background: var(--person-color, var(--surface-strong));
      color: #050505;
      flex-shrink: 0;
    }
    .bucket-empty { font-size: 12px; color: var(--ink-subtle); padding: 10px 4px; text-align: center; font-style: italic; }
    .bucket-more { font-size: 11px; color: var(--ink-muted); font-family: var(--font-mono); padding: 4px 4px 0; text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }

    /* Task table */
    .task-table { display: flex; flex-direction: column; gap: 4px; }
    .task-table-head, .task-table-row {
      display: grid;
      grid-template-columns: 1fr 120px 90px 100px 32px;
      gap: 10px;
      padding: 10px 12px;
      align-items: center;
    }
    .task-table-head {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 2px;
    }
    .task-table-row {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }
    .task-table-row:hover { border-color: var(--border-strong); }
    .task-table-row.overdue-row { border-left: 3px solid var(--overdue); }
    .tt-title { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tt-cell { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tt-assigned { display: flex; align-items: center; gap: 7px; }
    .tt-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; font-family: var(--font-display);
      background: var(--person-color, var(--surface-strong));
      color: #050505;
      flex-shrink: 0;
    }
    .tt-type-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .tt-type-tag.chore { background: var(--surface-strong); color: var(--ink-2); }
    .tt-type-tag.project { background: rgba(236, 72, 153, 0.15); color: var(--pink); }
    .tt-due-overdue { color: var(--overdue); font-weight: 600; }
    .tt-check {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .tt-check:hover { border-color: var(--gold); }
    .tt-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }

    @media (max-width: 720px) {
      .task-table-head { display: none; }
      .task-table-row {
        grid-template-columns: 1fr auto;
        grid-template-areas: "title check" "meta meta";
        gap: 5px 10px;
        padding: 10px 12px;
      }
      .tt-title { grid-area: title; }
      .tt-check { grid-area: check; align-self: start; }
      .tt-meta-row { grid-area: meta; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    }

    /* Task list (calendar day modal) */
    .empty { padding: 32px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 10px; }
    .empty-emoji { font-size: 24px; margin-bottom: 6px; }
    .empty-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .event-row-editable:hover { background: var(--hover); }

    /* Groceries */
    .grocery-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 6px;
    }
    .grocery-item.checked .grocery-item-text { text-decoration: line-through; color: var(--ink-muted); }
    .grocery-item-text {
      flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis;
      border: none; background: transparent; padding: 4px 2px; border-radius: 6px; color: var(--ink); font-family: inherit;
    }
    .grocery-item-text:focus { outline: none; background: var(--surface-strong); }
    .grocery-item-check {
      width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition);
    }
    .grocery-item-check:hover { border-color: var(--gold); }
    .grocery-item-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }
    .grocery-item.checked .grocery-item-check { background: var(--green); border-color: var(--green); }
    .grocery-item.checked .grocery-item-check svg { stroke: white; }
    .grocery-item-delete {
      width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--ink-muted); flex-shrink: 0; transition: var(--transition);
    }
    .grocery-item-delete:hover { color: var(--overdue); background: var(--hover); }
    .grocery-category-label {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
      padding: 14px 4px 6px;
    }
    .grocery-category-label:first-child { padding-top: 2px; }
    .grocery-item-cat {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 6px; max-width: 108px; flex-shrink: 0;
    }
    .grocery-item-cat:focus { outline: none; border-color: var(--gold); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--gold);
      color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: var(--transition);
      z-index: 50;
    }
    .fab:hover { transform: translateY(-2px); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 22px; height: 22px; }

    /* Calendar */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
    .cal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
    .cal-title-year { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); font-weight: 400; }
    .cal-arrow {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2); transition: var(--transition);
    }
    .cal-arrow:hover { background: var(--hover); border-color: var(--border-strong); }
    .cal-view-toggle { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; font-family: var(--font-mono); font-size: 11px; }
    .cal-view-toggle button { padding: 6px 12px; border-radius: 6px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
    .cal-view-toggle button.active { background: var(--gold); color: #050505; }

    .cal-grid { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; overflow-x: auto; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, minmax(74px, 1fr)); gap: 4px; margin-bottom: 6px; }
    .cal-weekday { text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 0; }
    .cal-days { display: grid; grid-template-columns: repeat(7, minmax(74px, 1fr)); gap: 4px; }
    .cal-day {
      border-radius: 9px;
      padding: 6px 5px 5px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 3px;
      background: transparent; border: 1px solid transparent;
      cursor: pointer; min-height: 76px; transition: var(--transition);
    }
    .cal-day:hover:not(.empty-day) { background: var(--surface-2); border-color: var(--border); }
    .cal-day.empty-day { pointer-events: none; }
    .cal-day-num { font-size: 13px; font-weight: 500; color: var(--ink-2); font-family: var(--font-display); }
    .cal-day.today .cal-day-num {
      background: var(--gold); color: #050505;
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .cal-day-events { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .cal-day-event-row { display: flex; align-items: center; gap: 5px; width: 100%; overflow: hidden; }
    .cal-day-event-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-color, var(--ink-muted)); flex-shrink: 0; }
    .cal-day-event-name { font-size: 10px; font-family: var(--font-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .cal-day-more { font-size: 9.5px; color: var(--ink-muted); font-family: var(--font-mono); padding-left: 13px; text-align: left; }
    .cal-day.has-events .cal-day-num { font-weight: 700; }

    /* Week view */
    .cal-week { display: flex; flex-direction: column; gap: 8px; }
    .cal-week-day {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: start;
    }
    .cal-week-day.today { border-left: 3px solid var(--gold); }
    .cal-week-day-label { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
    .cal-week-day-name { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
    .cal-week-day.today .cal-week-day-name { color: var(--gold); }
    .cal-week-day-num { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1; }
    .cal-week-day-events { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .cal-week-event {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
      cursor: pointer; transition: var(--transition); border-left: 3px solid var(--dot-color, var(--ink-muted));
    }
    .cal-week-event:hover { border-color: var(--border-strong); }
    .cal-week-event-icon { font-size: 13px; }

    .cal-week-day-empty { font-size: 12px; color: var(--ink-subtle); font-style: italic; padding: 3px 0; }

    /* Upcoming / list view */
    .upcoming { display: flex; flex-direction: column; gap: 6px; }
    .upcoming-month { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; padding: 18px 4px 8px; font-weight: 600; }

      display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      transition: var(--transition); border-left: 3px solid var(--dot-color, var(--ink-muted));
    }
    .upcoming-item:hover { border-color: var(--border-strong); }
    .upcoming-date { text-align: center; display: flex; flex-direction: column; align-items: center; }
    .upcoming-date-day { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; }
    .upcoming-date-month { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .upcoming-body { min-width: 0; }
    .upcoming-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .upcoming-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .task-meta-sep { width: 3px; height: 3px; background: var(--ink-subtle); border-radius: 50%; }

    /* Modal */
    .modal-scrim {
      position: fixed; inset: 0; background: var(--scrim);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
    }
    .modal-scrim.open { display: flex; }
    .modal {
      background: var(--surface-solid); border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      padding: 20px 18px 28px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    }
    @media (min-width: 640px) {
      .modal-scrim { align-items: center; }
      .modal { border-radius: 16px; margin: 20px; }
    }
    .modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: -6px auto 18px; }
    @media (min-width: 640px) { .modal-handle { display: none; } }
    .modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 18px; }

    .field { margin-bottom: 14px; }
    .field-label { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; font-weight: 600; }
    .field-input, .field-select, .field-textarea {
      width: 100%; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 9px; font-size: 14px; color: var(--ink); transition: var(--transition); font-family: inherit;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus { outline: none; border-color: var(--gold); }
    .field-textarea { resize: vertical; min-height: 64px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 20px; }
    .btn { padding: 10px 18px; border-radius: 9px; font-size: 13.5px; font-weight: 600; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-display); }
    .btn-primary { background: var(--gold); color: #050505; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { color: var(--ink-muted); }
    .btn-ghost:hover { color: var(--ink); }
    .btn-danger { color: var(--overdue); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.08); }

    /* Toast */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--surface-strong); color: var(--ink); border: 1px solid var(--border-strong);
      padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
      font-family: var(--font-display); opacity: 0; transition: var(--transition); z-index: 200; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .action-toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--surface-strong); color: var(--ink); border: 1px solid var(--border-strong);
      padding: 10px 12px 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
      display: none; align-items: center; gap: 12px; opacity: 0; transition: var(--transition);
      z-index: 210; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .action-toast.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
    .action-toast-undo {
      color: var(--gold); font-weight: 700; font-family: var(--font-display); font-size: 13px;
      padding: 6px 12px; border-radius: 999px; background: var(--surface-2);
    }
    .action-toast-undo:hover { background: var(--hover); }

    .snooze-btn {
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--gold);
      background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 999px; padding: 3px 9px; flex-shrink: 0; white-space: nowrap;
    }
    .snooze-btn:hover { background: rgba(234, 179, 8, 0.2); }

    .page { display: none; }
    .page.active { display: block; }

    @media (max-width: 480px) {
      .card { padding: 14px; }
      .card-title { font-size: 16px; }
      .cal-week-day { grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 12px; }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  </style>
</head>

  <script>
    'use strict';

    // Calls Airtable directly — no server proxy. Token is visible in page source;
    // only use this link with people you trust.
    const AIRTABLE_TOKEN = '__DFU_AIRTABLE_TOKEN__';
    const AIRTABLE_BASE_ID = 'appZVAWOFty3RFSRt';
    const AIRTABLE_TABLE_IDS = { People: 'tbliy0eovpt8vntvD', Tasks: 'tblTZ6WCgNLhnFEO4', Events: 'tblX5t8qVngufznCI', Groceries: 'tblkVvgWNIoiRoJXp', Messages: 'tblln5lLEbQUw9rMz' };
    const POLL_MS = 15_000;
    const GROCERY_FAST_POLL_MS = 4_000;

    const F = {
      people: { Name: 'fldec0P0X4FN7IWza', Birthday: 'fldxXbUA7mW9boXqq', Role: 'fldbc5LHx2k2oHUgB', ChoreAssignee: 'fld0fZ0d5OJh4SGAI', Color: 'fldb44jZLg1Edo3NE' },
      tasks: { Title: 'fldMtJDIfKfIleKES', Type: 'fldh1956G7z8QAol4', AssignedTo: 'fldxqr0515qC3x5df', CadenceDays: 'fldgHTNH9fHFxKe9F', NextDue: 'fldncFYrPjIxyoCZV', LastCompleted: 'flde4v0dzocaP17yR', Status: 'fldsglDycDr2Sirx9', Notes: 'fldvaagDHsHPCSNvQ' },
      events: { Title: 'fld7ycGWXXA6LEA8f', Date: 'fldAgyEp18ANapuFr', Recurring: 'fldReCr1LVEjMsxuP', Type: 'fldyTVNsEz6mcCM7D', People: 'fldCar4uKyu82q6ju', Notes: 'fld1jZVee9tC5mjdP' },
      groceries: { Item: 'fldLtIxVWklxWmCCI', Store: 'fldXymWMGqy8KEABV', Checked: 'fldzQyH1Gba7i1DZO' },
      messages: { Text: 'fldHymbPqXGCv20JS', Author: 'fldoyEHfBQiob7ozK', Created: 'flddahqfwepZ59Xrz' },
    };

    const state = {
      people: [], tasks: [], events: [], groceries: [], messages: [],
      currentPage: 'dashboard',
      calDate: new Date(),
      calView: 'grid',
      choreFilter: 'all',
      groceryStore: 'Food Lion',
      taskSearch: '',
    };

    (function initTheme() {
      const saved = localStorage.getItem('familyhq.theme');
      const theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('familyhq.theme', next);
    });

    (function initFontScale() {
      const saved = parseInt(localStorage.getItem('familyhq.fontScalePct'), 10);
      const pct = Number.isInteger(saved) ? saved : 100;
      document.documentElement.style.zoom = pct / 100;
    })();
    function openFontScaleModal() {
      const current = Math.round(parseFloat(document.documentElement.style.zoom || '1') * 100);
      openModal('Text size', `
        <div class="field">
          <input type="range" id="font-scale-slider" min="90" max="160" step="5" value="${current}" style="width:100%;accent-color:var(--gold);">
          <div style="text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);margin-top:10px" id="font-scale-value">${current}%</div>
        </div>
        <div class="modal-actions" style="justify-content:flex-end">
          <button class="btn btn-primary" data-close>Done</button>
        </div>
      `);
      const slider = document.getElementById('font-scale-slider');
      const label = document.getElementById('font-scale-value');
      slider.addEventListener('input', () => {
        const val = parseInt(slider.value, 10);
        label.textContent = `${val}%`;
        document.documentElement.style.zoom = val / 100;
        localStorage.setItem('familyhq.fontScalePct', val);
      });
    }
    document.getElementById('font-scale-toggle').addEventListener('click', openFontScaleModal);

    function airtableUrl(table, suffix = '') {
      const tableId = AIRTABLE_TABLE_IDS[table] || table;
      return `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableId}${suffix}`;
    }

    async function api(method, table, opts = {}) {
      const { id, body } = opts;
      const params = new URLSearchParams({ returnFieldsByFieldId: 'true' });
      const url = `${airtableUrl(table, id ? `/${id}` : '')}?${params.toString()}`;
      let payload = body;
      if (method === 'POST' && body && body.fields) {
        payload = { records: [{ fields: body.fields }], typecast: true, returnFieldsByFieldId: true };
      } else if (method === 'PATCH' && body && body.fields) {
        payload = { fields: body.fields, typecast: true, returnFieldsByFieldId: true };
      }
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
          'Content-Type': 'application/json',
        },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
      const data = await res.json();
      if (method === 'POST' && data.records) return data.records[0];
      return data;
    }

    async function listAll(table) {
      const acc = [];
      let offset;
      do {
        const params = new URLSearchParams({ pageSize: '100', returnFieldsByFieldId: 'true' });
        if (offset) params.set('offset', offset);
        const res = await fetch(`${airtableUrl(table)}?${params.toString()}`, {
          headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` },
        });
        if (!res.ok) throw new Error(`Failed to load ${table}`);
        const data = await res.json();
        acc.push(...(data.records || []));
        offset = data.offset;
      } while (offset);
      return acc;
    }

    const f = (rec, id) => rec?.fields?.[id];
    const personByName = name => name ? state.people.find(p => (f(p, F.people.Name) || '').toLowerCase() === name.toLowerCase()) : null;
    function personColor(name) { const p = personByName(name); if (!p) return null; const c = f(p, F.people.Color); return c ? `var(--person-${c})` : null; }
    function initials(name) { if (!name) return '?'; const parts = name.trim().split(/\s+/); return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase(); }
    function personCssVars(name) { const color = personColor(name); return color ? `--person-color:${color}` : ''; }

    // Assignment can be: empty (anyone), "Name" (one person), "Name, Name" (both),
    // or "Name ⇄ Name" (alternates each time it's completed — first name is whose turn it is)
    const ROTATE_SEP = ' ⇄ ';
    function isRotating(raw) { return typeof raw === 'string' && raw.includes(ROTATE_SEP); }
    function rotatingNames(raw) { return raw.split(ROTATE_SEP).map(s => s.trim()).filter(Boolean); }
    function currentAssignee(raw) { if (!raw) return ''; return isRotating(raw) ? rotatingNames(raw)[0] : raw; }
    function assigneeDisplayNames(raw) {
      if (!raw) return [];
      if (isRotating(raw)) { const n = currentAssignee(raw); return n ? [n] : []; }
      return raw.split(',').map(s => s.trim()).filter(Boolean);
    }
    function assigneeMeta(raw) {
      const rotating = isRotating(raw);
      const names = assigneeDisplayNames(raw);
      const label = names.join(' & ') + (rotating && names.length ? ' ⇄' : '');
      const avatarInitials = names.length <= 1 ? initials(names[0] || '') : names.map(n => (n.trim()[0] || '').toUpperCase()).join('');
      return { names, label, avatarInitials, primaryColorName: names[0] || '', rotating };
    }

    const DAY_MS = 24 * 60 * 60 * 1000;
    const toISODate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const parseISODate = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const daysBetween = (a, b) => Math.round((b - a) / DAY_MS);

    function formatDueLabel(dueStr) {
      if (!dueStr) return 'No due date';
      const due = parseISODate(dueStr);
      const diff = daysBetween(today(), due);
      if (diff < 0) return `Overdue ${Math.abs(diff)}d`;
      if (diff === 0) return 'Due today';
      if (diff === 1) return 'Due tomorrow';
      if (diff < 7) return `Due ${due.toLocaleDateString(undefined, { weekday: 'short' })}`;
      return `Due ${due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
    }

    function formatCadence(days) {
      if (!days) return 'One-off';
      if (days === 1) return 'Daily';
      if (days === 7) return 'Weekly';
      if (days === 14) return 'Biweekly';
      if (days === 30) return 'Monthly';
      if (days === 365) return 'Yearly';
      return `Every ${days}d`;
    }

    function isOverdue(task) {
      const due = f(task, F.tasks.NextDue);
      if (!due || f(task, F.tasks.Status) === 'Done') return false;
      return parseISODate(due) < today();
    }

    function setSync(status, label) {
      const el = document.getElementById('sync-status');
      el.classList.remove('syncing', 'error');
      if (status !== 'ok') el.classList.add(status);
      document.getElementById('sync-label').textContent = label || (status === 'ok' ? 'Live' : status);
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function showActionToast(msg, onUndo) {
      const el = document.getElementById('action-toast');
      document.getElementById('action-toast-msg').textContent = msg;
      const undoBtn = document.getElementById('action-toast-undo');
      el.classList.add('show');
      const hide = () => el.classList.remove('show');
      undoBtn.onclick = () => { onUndo(); hide(); };
      return hide;
    }

    // Optimistically removes an item, waits ~5s before actually deleting on the server,
    // and lets the user undo within that window.
    function scheduleUndoableDelete({ getArray, setArray, id, render, deleteApi, label }) {
      const arr = getArray();
      const idx = arr.findIndex(i => i.id === id);
      if (idx === -1) return;
      const [removed] = arr.splice(idx, 1);
      render();
      let undone = false;
      const timeoutId = setTimeout(async () => {
        if (undone) return;
        try {
          await deleteApi();
        } catch (err) {
          console.error(err);
          toast('Delete failed');
          loadAll();
        }
      }, 5000);
      showActionToast(`${label} deleted`, () => {
        undone = true;
        clearTimeout(timeoutId);
        const current = getArray();
        current.splice(idx, 0, removed);
        setArray(current);
        render();
      });
    }

    async function loadAll() {
      setSync('syncing', 'Syncing');
      try {
        const [people, tasks, events, groceries] = await Promise.all([listAll('People'), listAll('Tasks'), listAll('Events'), listAll('Groceries')]);
        state.people = people;
        state.tasks = tasks;
        state.events = events;
        state.groceries = groceries;
        if (AIRTABLE_TABLE_IDS.Messages) {
          state.messages = await listAll('Messages');
        }
        setSync('ok');
        renderAll();
      } catch (err) {
        console.error(err);
        setSync('error', 'Error');
      }
    }

    function renderChoreFilters() {
      const chips = [
        { key: 'all', label: 'Everyone' },
        { key: 'Anjanette', label: 'Anjanette' },
        { key: 'Jeff', label: 'Jeff' },
        { key: 'other', label: 'Other' },
      ];
      const html = chips.map(c => {
        const active = state.choreFilter === c.key ? 'active' : '';
        const color = (c.key !== 'all' && c.key !== 'other') ? personColor(c.key) : null;
        return `<button class="chip ${active}" data-filter="${c.key}">${color ? `<span class="chip-dot" style="--dot:${color}"></span>` : ''}${c.label}</button>`;
      }).join('');
      ['chore-filters', 'chore-filters-2'].forEach(id => {
        const wrap = document.getElementById(id);
        if (!wrap) return;
        wrap.innerHTML = html;
        wrap.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            state.choreFilter = btn.dataset.filter;
            renderChoreFilters();
            renderTasks();
          });
        });
      });
    }

    function renderTasks() {
      const filtered = state.tasks.filter(t => {
        const raw = f(t, F.tasks.AssignedTo) || '';
        const names = assigneeDisplayNames(raw).map(n => n.toLowerCase());
        if (state.choreFilter === 'all') return true;
        if (state.choreFilter === 'other') return !names.includes('anjanette') && !names.includes('jeff');
        return names.includes(state.choreFilter.toLowerCase());
      });

      const openTasks = filtered.filter(t => f(t, F.tasks.Status) !== 'Done');
      const now = today();
      const weekEnd = new Date(now.getTime() + 7 * DAY_MS);

      const buckets = { overdue: [], today: [], week: [], later: [], someday: [] };
      openTasks.forEach(t => {
        const due = f(t, F.tasks.NextDue);
        if (!due) { buckets.someday.push(t); return; }
        const d = parseISODate(due);
        if (d < now) buckets.overdue.push(t);
        else if (d.getTime() === now.getTime()) buckets.today.push(t);
        else if (d <= weekEnd) buckets.week.push(t);
        else buckets.later.push(t);
      });

      const sortByDue = (a, b) => (f(a, F.tasks.NextDue) || '9999').localeCompare(f(b, F.tasks.NextDue) || '9999');
      buckets.overdue.sort(sortByDue);
      buckets.today.sort(sortByDue);
      buckets.week.sort(sortByDue);
      buckets.later.sort(sortByDue);
      buckets.someday.sort((a, b) => (f(a, F.tasks.Title) || '').localeCompare(f(b, F.tasks.Title) || ''));

      const MAX_TOTAL = 15;
      const order = ['overdue', 'today', 'week', 'later', 'someday'];
      const perBucketShown = { overdue: 0, today: 0, week: 0, later: 0, someday: 0 };
      let remaining = MAX_TOTAL;
      const softCaps = { overdue: 15, today: 8, week: 6, later: 4, someday: 4 };
      order.forEach(k => {
        const take = Math.min(buckets[k].length, softCaps[k], remaining);
        perBucketShown[k] = take;
        remaining -= take;
      });
      order.forEach(k => {
        if (remaining <= 0) return;
        const extra = Math.min(buckets[k].length - perBucketShown[k], remaining);
        perBucketShown[k] += extra;
        remaining -= extra;
      });

      const bucketMeta = [
        { key: 'overdue', label: 'Overdue', cls: 'bucket-overdue' },
        { key: 'today', label: 'Today', cls: 'bucket-today' },
        { key: 'week', label: 'This Week', cls: 'bucket-week' },
        { key: 'later', label: 'Later', cls: 'bucket-later' },
        { key: 'someday', label: 'Someday', cls: 'bucket-later' },
      ];

      document.getElementById('bucket-total').textContent = openTasks.length;

      document.getElementById('buckets-grid').innerHTML = bucketMeta.map(b => {
        const items = buckets[b.key];
        const shown = perBucketShown[b.key];
        const more = items.length - shown;
        const list = shown === 0
          ? `<div class="bucket-empty">${items.length === 0 ? 'Nothing here' : `${items.length} hidden`}</div>`
          : items.slice(0, shown).map(taskMini).join('') + (more > 0 ? `<div class="bucket-more">+${more} more</div>` : '');
        return `
          <div class="bucket ${b.cls}">
            <div class="bucket-head">
              <span class="bucket-title">${b.label}</span>
              <span class="bucket-count">${items.length}</span>
            </div>
            ${list}
          </div>
        `;
      }).join('');

      const searchTerm = (state.taskSearch || '').trim().toLowerCase();
      const tableTasks = searchTerm
        ? openTasks.filter(t => (f(t, F.tasks.Title) || '').toLowerCase().includes(searchTerm))
        : openTasks;

      const sortedAll = [...tableTasks].sort((a, b) => {
        const aDue = f(a, F.tasks.NextDue) || '9999';
        const bDue = f(b, F.tasks.NextDue) || '9999';
        if (aDue !== bDue) return aDue.localeCompare(bDue);
        return (f(a, F.tasks.Title) || '').localeCompare(f(b, F.tasks.Title) || '');
      });
      document.getElementById('all-count').textContent = sortedAll.length;

      const table = document.getElementById('task-table');
      if (sortedAll.length === 0) {
        table.innerHTML = searchTerm
          ? `<div class="empty"><div class="empty-emoji">🔍</div><div class="empty-title">No matches</div>Try a different search.</div>`
          : `<div class="empty"><div class="empty-emoji">✨</div><div class="empty-title">All clear</div>No open tasks.</div>`;
      } else {
        table.innerHTML = `
          <div class="task-table-head">
            <div>Task</div>
            <div>Assigned</div>
            <div>Due</div>
            <div>Type</div>
            <div></div>
          </div>
          ${sortedAll.map(taskRow).join('')}
        `;
      }

      const activeCount = state.tasks.filter(t => f(t, F.tasks.Status) === 'Active').length;
      const overdueCount = state.tasks.filter(isOverdue).length;
      const projectsCount = state.tasks.filter(t => f(t, F.tasks.Type) === 'Project' && f(t, F.tasks.Status) !== 'Done').length;
      const upcomingCount = state.tasks.filter(t => {
        if (f(t, F.tasks.Status) === 'Done') return false;
        const due = f(t, F.tasks.NextDue);
        if (!due) return false;
        const d = parseISODate(due);
        return d >= now && d <= weekEnd;
      }).length;
      document.getElementById('stat-active').textContent = activeCount;
      document.getElementById('stat-overdue').textContent = overdueCount;
      document.getElementById('stat-projects').textContent = projectsCount;
      document.getElementById('stat-upcoming').textContent = upcomingCount;
      renderStreak();

      document.querySelectorAll('[data-task-id]').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('[data-action="check"]') || e.target.closest('[data-action="snooze"]')) return;
          openTaskModal(el.dataset.taskId);
        });
      });
      document.querySelectorAll('[data-action="check"]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          completeTask(el.dataset.taskId);
        });
      });
      document.querySelectorAll('[data-action="snooze"]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          snoozeTask(el.dataset.taskId);
        });
      });
    }

    async function snoozeTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const due = f(task, F.tasks.NextDue);
      const base = due ? parseISODate(due) : today();
      const newDue = toISODate(new Date(base.getTime() + DAY_MS));
      const updates = { [F.tasks.NextDue]: newDue };
      Object.assign(task.fields, updates);
      renderTasks();
      try {
        await api('PATCH', 'Tasks', { id, body: { fields: updates } });
        toast('Snoozed +1 day');
      } catch (err) {
        console.error(err);
        toast('Sync failed');
        loadAll();
      }
    }

    function startOfWeekSun(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - x.getDay());
      return x;
    }
    function renderStreak() {
      const weekStart = startOfWeekSun(today());
      const counts = {};
      state.people.filter(p => f(p, F.people.ChoreAssignee)).forEach(p => { counts[f(p, F.people.Name)] = 0; });
      state.tasks.forEach(t => {
        const lc = f(t, F.tasks.LastCompleted);
        if (!lc) return;
        const d = parseISODate(lc);
        if (d < weekStart) return;
        const raw = f(t, F.tasks.AssignedTo) || '';
        assigneeDisplayNames(raw).forEach(n => { if (counts[n] !== undefined) counts[n]++; });
      });
      const wrap = document.getElementById('streak-row');
      const entries = Object.entries(counts);
      wrap.innerHTML = entries.map(([name, count]) =>
        `<span class="streak-pill"><span class="streak-pill-num">${count}</span>${escapeHtml(name)} this week</span>`
      ).join('');
    }

    function taskMini(task) {
      const title = f(task, F.tasks.Title) || 'Untitled';
      const raw = f(task, F.tasks.AssignedTo) || '';
      const meta = assigneeMeta(raw);
      const due = f(task, F.tasks.NextDue);
      const overdue = isOverdue(task);
      const styleVars = personCssVars(meta.primaryColorName);
      const dueLabel = due ? formatDueLabel(due) : 'No due date';
      return `
        <div class="task-mini ${overdue ? 'overdue' : ''}" data-task-id="${task.id}" style="${styleVars}">
          <button class="task-mini-check" data-action="check" data-task-id="${task.id}" aria-label="Mark complete">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="task-mini-body">
            <div class="task-mini-title">${escapeHtml(title)}</div>
            <div class="task-mini-meta">
              ${meta.label ? `<span>${escapeHtml(meta.label)}</span><span class="task-meta-sep"></span>` : ''}
              <span class="task-mini-meta-due">${escapeHtml(dueLabel)}</span>
              ${overdue ? `<button class="snooze-btn" data-action="snooze" data-task-id="${task.id}">+1d</button>` : ''}
            </div>
          </div>
          ${meta.names.length ? `<div class="task-mini-avatar" title="${escapeAttr(meta.label)}">${escapeHtml(meta.avatarInitials)}</div>` : ''}
        </div>
      `;
    }

    function taskRow(task) {
      const title = f(task, F.tasks.Title) || 'Untitled';
      const type = f(task, F.tasks.Type) || 'Chore';
      const raw = f(task, F.tasks.AssignedTo) || '';
      const meta = assigneeMeta(raw);
      const due = f(task, F.tasks.NextDue);
      const overdue = isOverdue(task);
      const styleVars = personCssVars(meta.primaryColorName);
      const dueLabel = due ? formatDueLabel(due).replace(/^Due /, '') : '—';
      return `
        <div class="task-table-row ${overdue ? 'overdue-row' : ''}" data-task-id="${task.id}" style="${styleVars}">
          <div class="tt-title">${escapeHtml(title)}</div>
          <div class="tt-cell tt-assigned">
            ${meta.names.length ? `<span class="tt-avatar">${escapeHtml(meta.avatarInitials)}</span><span>${escapeHtml(meta.label)}</span>` : '<span>—</span>'}
          </div>
          <div class="tt-cell tt-due ${overdue ? 'tt-due-overdue' : ''}" style="display:flex;align-items:center;gap:6px">
            <span>${escapeHtml(dueLabel)}</span>
            ${overdue ? `<button class="snooze-btn" data-action="snooze" data-task-id="${task.id}">+1d</button>` : ''}
          </div>
          <div class="tt-cell tt-type"><span class="tt-type-tag ${type.toLowerCase()}">${escapeHtml(type)}</span></div>
          <button class="tt-check" data-action="check" data-task-id="${task.id}" aria-label="Mark complete">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      `;
    }

    async function completeTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const cadence = f(task, F.tasks.CadenceDays) || 0;
      const currentStatus = f(task, F.tasks.Status);
      const isCurrentlyDone = currentStatus === 'Done';
      const now = today();
      const nowIso = toISODate(now);
      let updates = {};
      if (isCurrentlyDone) {
        updates[F.tasks.Status] = 'Active';
        updates[F.tasks.LastCompleted] = null;
      } else if (cadence === 0) {
        updates[F.tasks.Status] = 'Done';
        updates[F.tasks.LastCompleted] = nowIso;
      } else {
        updates[F.tasks.LastCompleted] = nowIso;
        updates[F.tasks.NextDue] = toISODate(new Date(now.getTime() + cadence * DAY_MS));
      }
      // Rotating tasks swap whose turn it is when moving forward (not on undo)
      if (!isCurrentlyDone) {
        const rawAssigned = f(task, F.tasks.AssignedTo) || '';
        if (isRotating(rawAssigned)) {
          const [turn, next] = rotatingNames(rawAssigned);
          updates[F.tasks.AssignedTo] = `${next} ⇄ ${turn}`;
        }
      }
      Object.assign(task.fields, updates);
      renderTasks();
      try {
        await api('PATCH', 'Tasks', { id, body: { fields: updates } });
        toast(isCurrentlyDone ? 'Marked active' : (cadence === 0 ? 'Done ✓' : 'Next up scheduled'));
      } catch (err) {
        console.error(err);
        toast('Sync failed');
        loadAll();
      }
    }

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function normalizeMonthDay(s) {
      const parts = s.split('-');
      if (parts.length < 2) return null;
      return `${String(parseInt(parts[0],10)).padStart(2,'0')}-${String(parseInt(parts[1],10)).padStart(2,'0')}`;
    }

    function eventsForDate(d) {
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const iso = toISODate(d);
      const results = [];
      state.people.forEach(p => {
        const bday = f(p, F.people.Birthday);
        if (!bday) return;
        if (normalizeMonthDay(bday) === `${mm}-${dd}`) {
          const name = f(p, F.people.Name);
          results.push({ kind: 'birthday', title: `${name}'s birthday`, date: d, people: [name], color: personColor(name) });
        }
      });
      state.events.forEach(ev => {
        const dateStr = f(ev, F.events.Date);
        if (!dateStr) return;
        const recurring = f(ev, F.events.Recurring);
        const evDate = parseISODate(dateStr);
        let matches = false;
        if (recurring === 'Yearly') {
          matches = (evDate.getMonth() === d.getMonth() && evDate.getDate() === d.getDate());
        } else if (recurring === 'Weekly') {
          matches = (d.getDay() === evDate.getDay() && d >= evDate);
        } else {
          matches = dateStr === iso;
        }
        if (matches) {
          const type = f(ev, F.events.Type);
          const people = (f(ev, F.events.People) || '').split(',').map(s => s.trim()).filter(Boolean);
          results.push({
            kind: (type || 'other').toLowerCase(),
            title: f(ev, F.events.Title),
            date: d,
            recurring: recurring === 'Yearly',
            year: evDate.getFullYear(),
            people,
            color: people[0] ? personColor(people[0]) : null,
            id: ev.id,
          });
        }
      });
      return results;
    }

    function renderCalendar() {
      const gridEl = document.getElementById('cal-grid-container');
      const weekEl = document.getElementById('cal-week-container');
      const listEl = document.getElementById('cal-upcoming-container');
      gridEl.style.display = 'none';
      weekEl.style.display = 'none';
      listEl.style.display = 'none';

      if (state.calView === 'week') {
        weekEl.style.display = 'block';
        renderCalWeek();
      } else if (state.calView === 'list') {
        listEl.style.display = 'block';
        const y = state.calDate.getFullYear();
        const m = state.calDate.getMonth();
        document.getElementById('cal-title').innerHTML = `${MONTH_NAMES[m]}<span class="cal-title-year">${y}</span>`;
        renderCalUpcoming();
      } else {
        gridEl.style.display = 'block';
        const y = state.calDate.getFullYear();
        const m = state.calDate.getMonth();
        document.getElementById('cal-title').innerHTML = `${MONTH_NAMES[m]}<span class="cal-title-year">${y}</span>`;
        renderCalGrid(y, m);
      }
    }

    function startOfWeek(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - x.getDay());
      return x;
    }

    function renderCalWeek() {
      const start = startOfWeek(state.calDate);
      const end = new Date(start.getTime() + 6 * DAY_MS);
      const sameMonth = start.getMonth() === end.getMonth();
      const title = sameMonth
        ? `${MONTH_SHORT[start.getMonth()]} ${start.getDate()}–${end.getDate()}`
        : `${MONTH_SHORT[start.getMonth()]} ${start.getDate()} – ${MONTH_SHORT[end.getMonth()]} ${end.getDate()}`;
      document.getElementById('cal-title').innerHTML = `${title}<span class="cal-title-year">${start.getFullYear()}</span>`;

      const t = today();
      const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const cells = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        const isToday = d.getTime() === t.getTime();
        const events = eventsForDate(d);
        const evHtml = events.length
          ? events.map(e => {
              const iconMap = { birthday: '🎂', anniversary: '💕', appointment: '📅', holiday: '🎉', other: '·' };
              const icon = iconMap[e.kind] || '·';
              const sub = [e.kind.charAt(0).toUpperCase() + e.kind.slice(1)];
              if (e.people && e.people.length) sub.push(e.people.join(', '));
              return `
                <div class="cal-week-event" style="--dot-color:${e.color || 'var(--ink-muted)'}" ${e.id ? `data-event-id="${e.id}"` : ''}>
                  <span class="cal-week-event-bullet"></span>
                  <span class="cal-week-event-icon">${icon}</span>
                  <div class="cal-week-event-body">
                    <div class="cal-week-event-title">${escapeHtml(e.title)}</div>
                    <div class="cal-week-event-sub">${escapeHtml(sub.join(' · '))}</div>
                  </div>
                </div>
              `;
            }).join('')
          : `<div class="cal-week-day-empty">Nothing scheduled</div>`;
        cells.push(`
          <div class="cal-week-day ${isToday ? 'today' : ''}">
            <div class="cal-week-day-label">
              <span class="cal-week-day-name">${DAY_NAMES[i]}</span>
              <span class="cal-week-day-num">${d.getDate()}</span>
            </div>
            <div class="cal-week-day-events">${evHtml}</div>
          </div>
        `);
      }
      document.getElementById('cal-week').innerHTML = cells.join('');
      document.querySelectorAll('[data-event-id]').forEach(el => {
        el.addEventListener('click', () => openEventModal(el.dataset.eventId));
      });
    }

    function renderCalGrid(y, m) {
      const first = new Date(y, m, 1);
      const startWeekday = first.getDay();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const t = today();
      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push(`<div class="cal-day empty-day"></div>`);
      for (let d = 1; d <= lastDay; d++) {
        const date = new Date(y, m, d);
        const events = eventsForDate(date);
        const isToday = date.getTime() === t.getTime();
        const shown = events.slice(0, 2);
        const more = events.length - shown.length;
        const rows = shown.map(e => `
          <div class="cal-day-event-row">
            <span class="cal-day-event-dot" style="--dot-color:${e.color || 'var(--ink-muted)'}"></span>
            <span class="cal-day-event-name">${escapeHtml(e.title)}</span>
          </div>
        `).join('') + (more > 0 ? `<div class="cal-day-more">+${more} more</div>` : '');
        cells.push(`
          <button class="cal-day ${isToday ? 'today' : ''} ${events.length ? 'has-events' : ''}" data-date="${toISODate(date)}">
            <span class="cal-day-num">${d}</span>
            <div class="cal-day-events">${rows}</div>
          </button>
        `);
      }
      document.getElementById('cal-days').innerHTML = cells.join('');
      document.querySelectorAll('.cal-day[data-date]').forEach(el => {
        el.addEventListener('click', () => showDayEvents(el.dataset.date));
      });
    }

    function renderCalUpcoming() {
      const start = today();
      const items = [];
      for (let i = 0; i < 180; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        const evs = eventsForDate(d);
        evs.forEach(e => items.push(e));
      }
      if (items.length === 0) {
        document.getElementById('cal-upcoming').innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><div class="empty-title">Wide open</div>The next 6 months are clear.</div>`;
        return;
      }
      const grouped = {};
      items.forEach(e => {
        const key = `${e.date.getFullYear()}-${String(e.date.getMonth()+1).padStart(2,'0')}`;
        (grouped[key] = grouped[key] || []).push(e);
      });
      const html = Object.entries(grouped).map(([key, list]) => {
        const [y, m] = key.split('-');
        const label = `${MONTH_NAMES[parseInt(m,10)-1]} ${y}`;
        return `<div class="upcoming-month">${label}</div>${list.map(upcomingItem).join('')}`;
      }).join('');
      document.getElementById('cal-upcoming').innerHTML = html;
    }

    function upcomingItem(e) {
      const day = e.date.getDate();
      const month = MONTH_SHORT[e.date.getMonth()];
      const iconMap = { birthday: '🎂', anniversary: '💕', appointment: '📅', holiday: '🎉', other: '·' };
      const icon = iconMap[e.kind] || '·';
      const sub = [e.kind.charAt(0).toUpperCase() + e.kind.slice(1)];
      if (e.recurring && e.year && e.kind === 'anniversary') {
        const years = e.date.getFullYear() - e.year;
        if (years > 0) sub.push(`${years} year${years === 1 ? '' : 's'}`);
      }
      if (e.people && e.people.length) sub.push(e.people.join(', '));
      return `
        <div class="upcoming-item" style="--dot-color:${e.color || 'var(--ink-muted)'}">
          <div class="upcoming-date">
            <div class="upcoming-date-day">${day}</div>
            <div class="upcoming-date-month">${month}</div>
          </div>
          <div class="upcoming-body">
            <div class="upcoming-title">${escapeHtml(e.title)}</div>
            <div class="upcoming-sub">
              <span>${icon}</span>
              ${sub.map(s => `<span>${escapeHtml(s)}</span>`).join('<span class="task-meta-sep"></span>')}
            </div>
          </div>
        </div>
      `;
    }

    function showDayEvents(dateStr) {
      const d = parseISODate(dateStr);
      const events = eventsForDate(d);
      const dateLabel = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      const body = events.length
        ? events.map(e => `
            <div class="${e.id ? 'event-row-editable' : ''}" data-event-id="${e.id || ''}" style="padding:12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;${e.id ? 'cursor:pointer;border-radius:8px;' : ''}">
              <span style="width:10px;height:10px;border-radius:50%;background:${e.color || 'var(--ink-muted)'};flex-shrink:0"></span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-family:var(--font-display)">${escapeHtml(e.title)}</div>
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:3px;text-transform:capitalize">${e.kind}${e.people && e.people.length ? ' · ' + escapeHtml(e.people.join(', ')) : ''}</div>
              </div>
              ${e.id ? '<span style="color:var(--ink-muted);font-size:12px">Edit ›</span>' : ''}
            </div>
          `).join('')
        : `<div class="empty"><div class="empty-emoji">🌤️</div><div class="empty-title">Nothing scheduled</div></div>`;
      openModal(dateLabel, `
        ${body}
        <div class="modal-actions" style="justify-content:flex-end">
          <button class="btn btn-ghost" data-close>Close</button>
          <button class="btn btn-primary" id="add-event-for-day" data-date="${dateStr}">Add event</button>
        </div>
      `);
      document.getElementById('add-event-for-day').addEventListener('click', () => openEventModal(null, dateStr));
      document.querySelectorAll('#modal-body [data-event-id]').forEach(el => {
        const eid = el.dataset.eventId;
        if (!eid) return;
        el.addEventListener('click', () => openEventModal(eid));
      });
    }

    function openModal(title, body) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-scrim').classList.add('open');
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
    }
    function closeModal() { document.getElementById('modal-scrim').classList.remove('open'); }
    document.getElementById('modal-scrim').addEventListener('click', e => { if (e.target.id === 'modal-scrim') closeModal(); });

    function openTaskModal(id = null) {
      const task = id ? state.tasks.find(t => t.id === id) : null;
      const assignees = state.people.filter(p => f(p, F.people.ChoreAssignee)).map(p => f(p, F.people.Name)).filter(Boolean);
      const t = task || {};
      const title = f(t, F.tasks.Title) || '';
      const type = f(t, F.tasks.Type) || 'Chore';
      const assigned = f(t, F.tasks.AssignedTo) || '';
      const rotating = isRotating(assigned);
      const preChecked = rotating ? rotatingNames(assigned) : assigned.split(',').map(s => s.trim()).filter(Boolean);
      const cadence = f(t, F.tasks.CadenceDays) ?? 0;
      const nextDue = f(t, F.tasks.NextDue) || toISODate(today());
      const notes = f(t, F.tasks.Notes) || '';
      const standardCadences = [0, 1, 7, 14, 30, 90];

      openModal(id ? 'Edit task' : 'New task', `
        <div class="field"><label class="field-label" for="t-title">Title</label><input class="field-input" id="t-title" value="${escapeAttr(title)}" placeholder="e.g. Take out trash" /></div>
        <div class="field-row">
          <div class="field"><label class="field-label" for="t-type">Type</label><select class="field-select" id="t-type"><option ${type === 'Chore' ? 'selected' : ''}>Chore</option><option ${type === 'Project' ? 'selected' : ''}>Project</option></select></div>
          <div class="field">
            <label class="field-label">Assigned to</label>
            <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-top:6px">
              <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
                <input type="checkbox" id="t-assign-anyone" ${preChecked.length === 0 ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--gold)" />
                Anyone
              </label>
              ${assignees.map(a => `
                <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
                  <input type="checkbox" class="t-assignee-cb" value="${escapeAttr(a)}" ${preChecked.includes(a) ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--gold)" />
                  ${escapeHtml(a)}
                </label>
              `).join('')}
            </div>
          </div>
        </div>
        ${assignees.length >= 2 ? `
          <div class="field">
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer">
              <input type="checkbox" id="t-assign-rotate" ${rotating ? 'checked' : ''} style="width:14px;height:14px;accent-color:var(--gold)" />

          <div class="field" id="t-rotate-order-field" style="display:none">

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="t-cadence">Repeat</label>
            <select class="field-select" id="t-cadence">

              <option value="1" ${cadence == 1 ? 'selected' : ''}>Daily</option>
              <option value="7" ${cadence == 7 ? 'selected' : ''}>Weekly</option>
              <option value="14" ${cadence == 14 ? 'selected' : ''}>Biweekly</option>
              <option value="30" ${cadence == 30 ? 'selected' : ''}>Monthly</option>
              <option value="90" ${cadence == 90 ? 'selected' : ''}>Quarterly</option>
              <option value="__custom" ${!standardCadences.includes(cadence) ? 'selected' : ''}>Custom…</option>
            </select>
            <input class="field-input" id="t-cadence-custom" type="number" min="0" style="display:${!standardCadences.includes(cadence) ? 'block' : 'none'};margin-top:8px" value="${cadence}" placeholder="Days between" />

          <div class="field"><label class="field-label" for="t-due">Next due</label><div style="display:flex;gap:6px"><input class="field-input" id="t-due" type="date" value="${nextDue}" style="flex:1" /><button type="button" class="btn btn-ghost" id="t-due-clear" style="padding:10px 12px">Clear</button></div></div>
        </div>
        <div class="field"><label class="field-label" for="t-notes">Notes</label><textarea class="field-textarea" id="t-notes" placeholder="Optional">${escapeHtml(notes)}</textarea></div>
        <div class="modal-actions">
          ${id ? '<button class="btn btn-danger" id="t-delete">Delete</button>' : '<span></span>'}
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="t-save">Save</button></div>
        </div>
      `);

      document.getElementById('t-cadence').addEventListener('change', e => {
        document.getElementById('t-cadence-custom').style.display = e.target.value === '__custom' ? 'block' : 'none';
      });
      document.getElementById('t-due-clear').addEventListener('click', () => {
        document.getElementById('t-due').value = '';
      });
      const anyoneCb = document.getElementById('t-assign-anyone');
      const assigneeCbs = Array.from(document.querySelectorAll('.t-assignee-cb'));
      const rotateCb = document.getElementById('t-assign-rotate');
      const existingRotatingNames = rotating ? rotatingNames(assigned) : [];

      function updateRotateOrderUI() {
        const orderField = document.getElementById('t-rotate-order-field');
        if (!orderField) return;
        const checked = assigneeCbs.filter(cb => cb.checked).map(cb => cb.value);
        if (rotateCb && rotateCb.checked && checked.length === 2) {
          orderField.style.display = 'block';
          const defaultFirst = (existingRotatingNames.length === 2 && checked.every(n => existingRotatingNames.includes(n)))
            ? existingRotatingNames[0]
            : checked[0];
          document.getElementById('t-rotate-order-options').innerHTML = checked.map(n => `
            <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer">
              <input type="radio" name="t-rotate-first" value="${escapeAttr(n)}" ${n === defaultFirst ? 'checked' : ''} style="width:15px;height:15px;accent-color:var(--gold)" />
              ${escapeHtml(n)}
            </label>
          `).join('');
        } else {
          orderField.style.display = 'none';
        }
      }

      anyoneCb.addEventListener('change', () => {
        if (anyoneCb.checked) assigneeCbs.forEach(cb => { cb.checked = false; });
        updateRotateOrderUI();
      });
      assigneeCbs.forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) anyoneCb.checked = false;
          updateRotateOrderUI();
        });
      });
      if (rotateCb) rotateCb.addEventListener('change', updateRotateOrderUI);
      updateRotateOrderUI();

      document.getElementById('t-save').addEventListener('click', async () => {
        const title = document.getElementById('t-title').value.trim();
        if (!title) { toast('Give it a title'); return; }
        let cadenceVal = document.getElementById('t-cadence').value;
        cadenceVal = cadenceVal === '__custom' ? (parseInt(document.getElementById('t-cadence-custom').value, 10) || 0) : parseInt(cadenceVal, 10);

        const anyoneChecked = document.getElementById('t-assign-anyone').checked;
        const checkedBoxes = anyoneChecked ? [] : Array.from(document.querySelectorAll('.t-assignee-cb:checked')).map(cb => cb.value);
        const rotateEl = document.getElementById('t-assign-rotate');
        const wantsRotate = rotateEl && rotateEl.checked && checkedBoxes.length === 2;
        let assignedValue;
        if (wantsRotate) {
          const firstRadio = document.querySelector('input[name="t-rotate-first"]:checked');
          const first = firstRadio ? firstRadio.value : checkedBoxes[0];
          const second = checkedBoxes[0] === first ? checkedBoxes[1] : checkedBoxes[0];
          assignedValue = `${first} ⇄ ${second}`;
        } else if (checkedBoxes.length > 0) {
          assignedValue = checkedBoxes.join(', ');
        } else {
          assignedValue = null;
        }

        const fields = {
          [F.tasks.Title]: title,
          [F.tasks.Type]: document.getElementById('t-type').value,
          [F.tasks.AssignedTo]: assignedValue,
          [F.tasks.CadenceDays]: cadenceVal,
          [F.tasks.NextDue]: document.getElementById('t-due').value || null,
          [F.tasks.Notes]: document.getElementById('t-notes').value.trim() || null,
        };
        if (!id) fields[F.tasks.Status] = 'Active';
        try {
          if (id) {
            const updated = await api('PATCH', 'Tasks', { id, body: { fields } });
            const idx = state.tasks.findIndex(t => t.id === id);
            if (idx >= 0) state.tasks[idx] = updated;
          } else {
            const created = await api('POST', 'Tasks', { body: { fields } });
            state.tasks.push(created);
          }
          closeModal();
          renderTasks();
          toast(id ? 'Saved' : 'Added');
        } catch (err) {
          console.error(err);
          toast('Save failed');
        }
      });

      if (id) {
        document.getElementById('t-delete').addEventListener('click', () => {
          closeModal();
          scheduleUndoableDelete({
            getArray: () => state.tasks,
            setArray: (arr) => { state.tasks = arr; },
            id,
            render: renderTasks,
            deleteApi: () => api('DELETE', 'Tasks', { id }),
            label: 'Task',
          });
        });
      }
    }
