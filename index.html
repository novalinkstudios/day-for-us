        <div class="field">
          <input type="range" id="font-scale-slider" min="90" max="160" step="5" value="${current}" style="width:100%;accent-color:var(--primary);">
          <div style="text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);margin-top:10px" id="font-scale-value">${current}%</div>
        </div>
        <div class="modal-actions" style="justify-content:flex-end">
          <button class="btn btn-primary" data-close>Done</button>
        </div>
      `);
      const slider = document.getElementById('font-scale-slider');
      const label = document.getElementById('font-scale-value');
      slider.addEventListener('input', () => {
        const val = parseInt(slider.value, 10);
        label.textContent = `${val}%`;
        document.documentElement.style.zoom = val / 100;
        localStorage.setItem('familyhq.fontScalePct', val);
      });
    }
    document.getElementById('font-scale-toggle').addEventListener('click', openFontScaleModal);

    function airtableUrl(table, suffix = '') {
      const tableId = AIRTABLE_TABLE_IDS[table] || table;
      return `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableId}${suffix}`;
    }

    async function api(method, table, opts = {}) {
      const { id, body } = opts;
      const params = new URLSearchParams({ returnFieldsByFieldId: 'true' });
      const url = `${airtableUrl(table, id ? `/${id}` : '')}?${params.toString()}`;
      let payload = body;
      if (method === 'POST' && body && body.fields) {
        payload = { records: [{ fields: body.fields }], typecast: true, returnFieldsByFieldId: true };
      } else if (method === 'PATCH' && body && body.fields) {
        payload = { fields: body.fields, typecast: true, returnFieldsByFieldId: true };
      }
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
          'Content-Type': 'application/json',
        },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
      const data = await res.json();
      if (method === 'POST' && data.records) return data.records[0];
      return data;
    }

    async function listAll(table) {
      const acc = [];
      let offset;
      do {
        const params = new URLSearchParams({ pageSize: '100', returnFieldsByFieldId: 'true' });
        if (offset) params.set('offset', offset);
        const res = await fetch(`${airtableUrl(table)}?${params.toString()}`, {
          headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` },
        });
        if (!res.ok) throw new Error(`Failed to load ${table}`);
        const data = await res.json();
        acc.push(...(data.records || []));
        offset = data.offset;
      } while (offset);
      return acc;
    }

    const f = (rec, id) => rec?.fields?.[id];

    // People are handled via a singleSelect field (Assigned): Anjanette, Chanelle, Both, Other.
    const PERSON_COLORS = {
      Anjanette: 'var(--person-Anjanette)',
      Chanelle: 'var(--person-Chanelle)',
      Both: 'var(--person-Both)',
      Other: 'var(--person-Other)',
    };
    function personColor(name) { return PERSON_COLORS[name] || null; }
    function initials(name) { if (!name) return '?'; const parts = name.trim().split(/\s+/); return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase(); }
    function personCssVars(name) { const color = personColor(name); return color ? `--person-color:${color}` : ''; }

    // Simple assignee display: shows the Assigned value directly. If "Other", also shows
    // the OtherAssignee text field when present.
    function assigneeMeta(record, assignedField, otherField) {
      const assigned = f(record, assignedField) || '';
      let label = assigned;
      if (assigned === 'Other') {
        const other = f(record, otherField);
        label = other ? `Other: ${other}` : 'Other';
      }
      const avatarInitials = assigned === 'Other' ? 'OT' : (assigned ? initials(assigned) : '');
      return { assigned, label, avatarInitials, colorName: assigned };
    }

    const DAY_MS = 24 * 60 * 60 * 1000;
    const toISODate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const parseISODate = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const daysBetween = (a, b) => Math.round((b - a) / DAY_MS);

    function formatDateLabel(dateStr) {
      if (!dateStr) return '';
      const d = parseISODate(dateStr);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function setSync(status, label) {
      const el = document.getElementById('sync-status');
      el.classList.remove('syncing', 'error');
      if (status !== 'ok') el.classList.add(status);
      document.getElementById('sync-label').textContent = label || (status === 'ok' ? 'Live' : status);
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function showActionToast(msg, onUndo) {
      const el = document.getElementById('action-toast');
      document.getElementById('action-toast-msg').textContent = msg;
      const undoBtn = document.getElementById('action-toast-undo');
      el.classList.add('show');
      const hide = () => el.classList.remove('show');
      undoBtn.onclick = () => { onUndo(); hide(); };
      return hide;
    }

    // Optimistically removes an item, waits ~5s before actually deleting on the server,
    // and lets the user undo within that window.
    function scheduleUndoableDelete({ getArray, setArray, id, render, deleteApi, label }) {
      const arr = getArray();
      const idx = arr.findIndex(i => i.id === id);
      if (idx === -1) return;
      const [removed] = arr.splice(idx, 1);
      render();
      let undone = false;
      const timeoutId = setTimeout(async () => {
        if (undone) return;
        try {
          await deleteApi();
        } catch (err) {
          console.error(err);
          toast('Delete failed');
          loadAll();
        }
      }, 5000);
      showActionToast(`${label} deleted`, () => {
        undone = true;
        clearTimeout(timeoutId);
        const current = getArray();
        current.splice(idx, 0, removed);
        setArray(current);
        render();
      });
    }

    async function loadAll() {
      setSync('syncing', 'Syncing');
      try {
        const [tasks, sessions, notes, roadmap] = await Promise.all([
          listAll('Tasks'), listAll('Sessions'), listAll('Notes'), listAll('Roadmap')
        ]);
        state.tasks = tasks;
        state.sessions = sessions;
        state.notes = notes;
        state.roadmap = roadmap;
        setSync('ok');
        renderAll();
      } catch (err) {
        console.error(err);
        setSync('error', 'Error');
      }
    }

    function renderTaskFilters() {
      const chips = [
        { key: 'all', label: 'Everyone' },
        { key: 'Anjanette', label: 'Anjanette' },
        { key: 'Chanelle', label: 'Chanelle' },
        { key: 'Other', label: 'Other' },
      ];
      const html = chips.map(c => {
        const active = state.taskFilter === c.key ? 'active' : '';
        const color = c.key !== 'all' ? personColor(c.key) : null;
        return `<button class="chip ${active}" data-filter="${c.key}">${color ? `<span class="chip-dot" style="--dot:${color}"></span>` : ''}${c.label}</button>`;
      }).join('');
      ['task-filters', 'task-filters-2'].forEach(id => {
        const wrap = document.getElementById(id);
        if (!wrap) return;
        wrap.innerHTML = html;
        wrap.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            state.taskFilter = btn.dataset.filter;
            renderTaskFilters();
            renderTasks();
          });
        });
      });
    }

    function matchesTaskFilter(task) {
      if (state.taskFilter === 'all') return true;
      return (f(task, F.tasks.Assigned) || '') === state.taskFilter;
    }

    function renderTasks() {
      const filtered = state.tasks.filter(matchesTaskFilter);
      const openTasks = filtered.filter(t => f(t, F.tasks.Status) !== 'Done');

      const buckets = { tackling: [], ondeck: [], backlog: [] };
      openTasks.forEach(t => {
        const status = f(t, F.tasks.Status);
        if (status === 'Tackling') buckets.tackling.push(t);
        else if (status === 'On Deck') buckets.ondeck.push(t);
        else buckets.backlog.push(t);
      });

      const sortByName = (a, b) => (f(a, F.tasks.Name) || '').localeCompare(f(b, F.tasks.Name) || '');
      Object.values(buckets).forEach(list => list.sort(sortByName));

      const MAX_TOTAL = 15;
      const order = ['tackling', 'ondeck', 'backlog'];
      const perBucketShown = { tackling: 0, ondeck: 0, backlog: 0 };
      let remaining = MAX_TOTAL;
      const softCaps = { tackling: 8, ondeck: 8, backlog: 6 };
      order.forEach(k => {
        const take = Math.min(buckets[k].length, softCaps[k], remaining);
        perBucketShown[k] = take;
        remaining -= take;
      });
      order.forEach(k => {
        if (remaining <= 0) return;
        const extra = Math.min(buckets[k].length - perBucketShown[k], remaining);
        perBucketShown[k] += extra;
        remaining -= extra;
      });

      const bucketMeta = [
        { key: 'tackling', label: 'Tackling', cls: 'bucket-today' },
        { key: 'ondeck', label: 'On Deck', cls: 'bucket-week' },
        { key: 'backlog', label: 'Backlog', cls: 'bucket-later' },
      ];

      document.getElementById('bucket-total').textContent = openTasks.length;

      document.getElementById('buckets-grid').innerHTML = bucketMeta.map(b => {
        const items = buckets[b.key];
        const shown = perBucketShown[b.key];
        const more = items.length - shown;
        const list = shown === 0
          ? `<div class="bucket-empty">${items.length === 0 ? 'Nothing here' : `${items.length} hidden`}</div>`
          : items.slice(0, shown).map(taskMini).join('') + (more > 0 ? `<div class="bucket-more">+${more} more</div>` : '');
        return `
          <div class="bucket ${b.cls}">
            <div class="bucket-head">
              <span class="bucket-title">${b.label}</span>
              <span class="bucket-count">${items.length}</span>
            </div>
            ${list}
          </div>
        `;
      }).join('');

      const searchTerm = (state.taskSearch || '').trim().toLowerCase();
      const tableTasks = searchTerm
        ? filtered.filter(t => (f(t, F.tasks.Name) || '').toLowerCase().includes(searchTerm))
        : filtered;

      const statusOrder = { 'Tackling': 0, 'On Deck': 1, 'Backlog': 2, 'Done': 3 };
      const sortedAll = [...tableTasks].sort((a, b) => {
        const aStatus = statusOrder[f(a, F.tasks.Status)] ?? 4;
        const bStatus = statusOrder[f(b, F.tasks.Status)] ?? 4;
        if (aStatus !== bStatus) return aStatus - bStatus;
        return (f(a, F.tasks.Name) || '').localeCompare(f(b, F.tasks.Name) || '');
      });
      document.getElementById('all-count').textContent = sortedAll.length;

      const table = document.getElementById('task-table');
      if (sortedAll.length === 0) {
        table.innerHTML = searchTerm
          ? `<div class="empty"><div class="empty-emoji">🔍</div><div class="empty-title">No matches</div>Try a different search.</div>`
          : `<div class="empty"><div class="empty-emoji">✨</div><div class="empty-title">All clear</div>No tasks yet.</div>`;
      } else {
        table.innerHTML = `
          <div class="task-table-head">
            <div>Task</div>
            <div>Assigned</div>
            <div>Status</div>
            <div>Type</div>
            <div></div>
          </div>
          ${sortedAll.map(taskRow).join('')}
        `;
      }

      const tacklingCount = state.tasks.filter(t => f(t, F.tasks.Status) === 'Tackling').length;
      const ondeckCount = state.tasks.filter(t => f(t, F.tasks.Status) === 'On Deck').length;
      const projectsCount = state.roadmap.length;
      const backlogCount = state.tasks.filter(t => f(t, F.tasks.Status) === 'Backlog').length;
      document.getElementById('stat-tackling').textContent = tacklingCount;
      document.getElementById('stat-ondeck').textContent = ondeckCount;
      document.getElementById('stat-projects').textContent = projectsCount;
      document.getElementById('stat-backlog').textContent = backlogCount;

      document.querySelectorAll('[data-task-id]').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('[data-action="check"]')) return;
          openTaskModal(el.dataset.taskId);
        });
      });
      document.querySelectorAll('[data-action="check"]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          completeTask(el.dataset.taskId);
        });
      });
    }

    function taskMini(task) {
      const title = f(task, F.tasks.Name) || 'Untitled';
      const meta = assigneeMeta(task, F.tasks.Assigned, F.tasks.OtherAssignee);
      const styleVars = personCssVars(meta.colorName);
      return `
        <div class="task-mini" data-task-id="${task.id}" style="${styleVars}">
          <button class="task-mini-check" data-action="check" data-task-id="${task.id}" aria-label="Mark done">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="task-mini-body">
            <div class="task-mini-title">${escapeHtml(title)}</div>
            ${meta.label ? `<div class="task-mini-meta"><span>${escapeHtml(meta.label)}</span></div>` : ''}
          </div>
          ${meta.label ? `<div class="task-mini-avatar" title="${escapeAttr(meta.label)}">${escapeHtml(meta.avatarInitials)}</div>` : ''}
        </div>
      `;
    }

    function taskRow(task) {
      const title = f(task, F.tasks.Name) || 'Untitled';
      const type = f(task, F.tasks.Type) || 'Task';
      const status = f(task, F.tasks.Status) || 'Backlog';
      const meta = assigneeMeta(task, F.tasks.Assigned, F.tasks.OtherAssignee);
      const styleVars = personCssVars(meta.colorName);
      return `
        <div class="task-table-row" data-task-id="${task.id}" style="${styleVars}">
          <div class="tt-title">${escapeHtml(title)}</div>
          <div class="tt-cell tt-assigned">
            ${meta.label ? `<span class="tt-avatar">${escapeHtml(meta.avatarInitials)}</span><span>${escapeHtml(meta.label)}</span>` : '<span>—</span>'}
          </div>
          <div class="tt-cell tt-status">${escapeHtml(status)}</div>
          <div class="tt-cell tt-type"><span class="tt-type-tag ${type.toLowerCase()}">${escapeHtml(type)}</span></div>
          <button class="tt-check" data-action="check" data-task-id="${task.id}" aria-label="Mark done">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      `;
    }

    async function completeTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const currentStatus = f(task, F.tasks.Status);
      const isDone = currentStatus === 'Done';
      const newStatus = isDone ? 'Tackling' : 'Done';
      const updates = { [F.tasks.Status]: newStatus };
      Object.assign(task.fields, updates);
      renderTasks();
      try {
        await api('PATCH', 'Tasks', { id, body: { fields: updates } });
        toast(isDone ? 'Back to tackling' : 'Done ✓');
      } catch (err) {
        console.error(err);
        toast('Sync failed');
        loadAll();
      }
    }

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function eventsForDate(d) {
      const iso = toISODate(d);
      const results = [];
      state.sessions.forEach(s => {
        const dateStr = f(s, F.sessions.Date);
        if (dateStr !== iso) return;
        results.push({
          title: f(s, F.sessions.Name) || 'Untitled',
          date: d,
          description: f(s, F.sessions.Description) || '',
          id: s.id,
        });
      });
      return results;
    }

    function renderCalendar() {
      const gridEl = document.getElementById('cal-grid-container');
      const weekEl = document.getElementById('cal-week-container');
      const listEl = document.getElementById('cal-upcoming-container');
      gridEl.style.display = 'none';
      weekEl.style.display = 'none';
      listEl.style.display = 'none';

      if (state.calView === 'week') {
        weekEl.style.display = 'block';
        renderCalWeek();
      } else if (state.calView === 'list') {
        listEl.style.display = 'block';
        const y = state.calDate.getFullYear();
        const m = state.calDate.getMonth();
        document.getElementById('cal-title').innerHTML = `${MONTH_NAMES[m]}<span class="cal-title-year">${y}</span>`;
        renderCalUpcoming();
      } else {
        gridEl.style.display = 'block';
        const y = state.calDate.getFullYear();
        const m = state.calDate.getMonth();
        document.getElementById('cal-title').innerHTML = `${MONTH_NAMES[m]}<span class="cal-title-year">${y}</span>`;
        renderCalGrid(y, m);
      }
    }

    function startOfWeek(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - x.getDay());
      return x;
    }

    function renderCalWeek() {
      const start = startOfWeek(state.calDate);
      const end = new Date(start.getTime() + 6 * DAY_MS);
      const sameMonth = start.getMonth() === end.getMonth();
      const title = sameMonth
        ? `${MONTH_SHORT[start.getMonth()]} ${start.getDate()}–${end.getDate()}`
        : `${MONTH_SHORT[start.getMonth()]} ${start.getDate()} – ${MONTH_SHORT[end.getMonth()]} ${end.getDate()}`;
      document.getElementById('cal-title').innerHTML = `${title}<span class="cal-title-year">${start.getFullYear()}</span>`;

      const t = today();
      const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const cells = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        const isToday = d.getTime() === t.getTime();
        const events = eventsForDate(d);
        const evHtml = events.length
          ? events.map(e => `
              <div class="cal-week-event" data-event-id="${e.id}">
                <span class="cal-week-event-bullet"></span>
                <div class="cal-week-event-body">
                  <div class="cal-week-event-title">${escapeHtml(e.title)}</div>
                  ${e.description ? `<div class="cal-week-event-sub">${escapeHtml(e.description)}</div>` : ''}
                </div>
              </div>
            `).join('')
          : `<div class="cal-week-day-empty">Nothing scheduled</div>`;
        cells.push(`
          <div class="cal-week-day ${isToday ? 'today' : ''}">
            <div class="cal-week-day-label">
              <span class="cal-week-day-name">${DAY_NAMES[i]}</span>
              <span class="cal-week-day-num">${d.getDate()}</span>
            </div>
            <div class="cal-week-day-events">${evHtml}</div>
          </div>
        `);
      }
      document.getElementById('cal-week').innerHTML = cells.join('');
      document.querySelectorAll('[data-event-id]').forEach(el => {
        el.addEventListener('click', () => openSessionModal(el.dataset.eventId));
      });
    }

    function renderCalGrid(y, m) {
      const first = new Date(y, m, 1);
      const startWeekday = first.getDay();
      const lastDay = new Date(y, m + 1, 0).getDate();
      const t = today();
      const cells = [];
      for (let i = 0; i < startWeekday; i++) cells.push(`<div class="cal-day empty-day"></div>`);
      for (let d = 1; d <= lastDay; d++) {
        const date = new Date(y, m, d);
        const events = eventsForDate(date);
        const isToday = date.getTime() === t.getTime();
        const shown = events.slice(0, 2);
        const more = events.length - shown.length;
        const rows = shown.map(e => `
          <div class="cal-day-event-row">
            <span class="cal-day-event-dot" style="--dot-color:${e.color || 'var(--ink-muted)'}"></span>
            <span class="cal-day-event-name">${escapeHtml(e.title)}</span>
          </div>
        `).join('') + (more > 0 ? `<div class="cal-day-more">+${more} more</div>` : '');
        cells.push(`
          <button class="cal-day ${isToday ? 'today' : ''} ${events.length ? 'has-events' : ''}" data-date="${toISODate(date)}">
            <span class="cal-day-num">${d}</span>
            <div class="cal-day-events">${rows}</div>
          </button>
        `);
      }
      document.getElementById('cal-days').innerHTML = cells.join('');
      document.querySelectorAll('.cal-day[data-date]').forEach(el => {
        el.addEventListener('click', () => showDayEvents(el.dataset.date));
      });
    }

    function renderCalUpcoming() {
      const start = today();
      const items = [];
      for (let i = 0; i < 180; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        const evs = eventsForDate(d);
        evs.forEach(e => items.push(e));
      }
      if (items.length === 0) {
        document.getElementById('cal-upcoming').innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><div class="empty-title">Wide open</div>The next 6 months are clear.</div>`;
        return;
      }
      const grouped = {};
      items.forEach(e => {
        const key = `${e.date.getFullYear()}-${String(e.date.getMonth()+1).padStart(2,'0')}`;
        (grouped[key] = grouped[key] || []).push(e);
      });
      const html = Object.entries(grouped).map(([key, list]) => {
        const [y, m] = key.split('-');
        const label = `${MONTH_NAMES[parseInt(m,10)-1]} ${y}`;
        return `<div class="upcoming-month">${label}</div>${list.map(upcomingItem).join('')}`;
      }).join('');
      document.getElementById('cal-upcoming').innerHTML = html;
    }

    function upcomingItem(e) {
      const day = e.date.getDate();
      const month = MONTH_SHORT[e.date.getMonth()];
      return `
        <div class="upcoming-item">
          <div class="upcoming-date">
            <div class="upcoming-date-day">${day}</div>
            <div class="upcoming-date-month">${month}</div>
          </div>
          <div class="upcoming-body">
            <div class="upcoming-title">${escapeHtml(e.title)}</div>
            ${e.description ? `<div class="upcoming-sub">${escapeHtml(e.description)}</div>` : ''}
          </div>
        </div>
      `;
    }

    function showDayEvents(dateStr) {
      const d = parseISODate(dateStr);
      const events = eventsForDate(d);
      const dateLabel = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      const body = events.length
        ? events.map(e => `
            <div class="event-row-editable" data-event-id="${e.id}" style="padding:12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:8px;">
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-family:var(--font-display)">${escapeHtml(e.title)}</div>
                ${e.description ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:3px">${escapeHtml(e.description)}</div>` : ''}
              </div>
              <span style="color:var(--ink-muted);font-size:12px">Edit ›</span>
            </div>
          `).join('')
        : `<div class="empty"><div class="empty-emoji">🌤️</div><div class="empty-title">Nothing scheduled</div></div>`;
      openModal(dateLabel, `
        ${body}
        <div class="modal-actions" style="justify-content:flex-end">
          <button class="btn btn-ghost" data-close>Close</button>
          <button class="btn btn-primary" id="add-event-for-day" data-date="${dateStr}">Add session</button>
        </div>
      `);
      document.getElementById('add-event-for-day').addEventListener('click', () => openSessionModal(null, dateStr));
      document.querySelectorAll('#modal-body [data-event-id]').forEach(el => {
        const eid = el.dataset.eventId;
        if (!eid) return;
        el.addEventListener('click', () => openSessionModal(eid));
      });
    }

    function openModal(title, body) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-scrim').classList.add('open');
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
    }
    function closeModal() { document.getElementById('modal-scrim').classList.remove('open'); }
    document.getElementById('modal-scrim').addEventListener('click', e => { if (e.target.id === 'modal-scrim') closeModal(); });

    function openTaskModal(id = null, defaultProjectId = null) {
      const task = id ? state.tasks.find(t => t.id === id) : null;
      const t = task || {};
      const title = f(t, F.tasks.Name) || '';
      const type = f(t, F.tasks.Type) || 'Task';
      const status = f(t, F.tasks.Status) || 'Backlog';
      const assigned = f(t, F.tasks.Assigned) || '';
      const otherAssignee = f(t, F.tasks.OtherAssignee) || '';
      const sessionDate = f(t, F.tasks.SessionDate) || '';
      const notes = f(t, F.tasks.Notes) || '';
      const taskProjectIds = F.tasks.Project ? (f(t, F.tasks.Project) || []) : [];
      const taskProjectId = id ? (Array.isArray(taskProjectIds) ? taskProjectIds[0] || '' : '') : (defaultProjectId || '');

      const projectOptions = state.roadmap.map(r => {
        const rName = f(r, F.roadmap.Name) || 'Untitled';
        const sel = r.id === taskProjectId ? 'selected' : '';
        return `<option value="${r.id}" ${sel}>${escapeHtml(rName)}</option>`;
      }).join('');

      openModal(id ? 'Edit task' : 'New task', `
        <div class="field"><label class="field-label" for="t-title">Title</label><input class="field-input" id="t-title" value="${escapeAttr(title)}" placeholder="e.g. Plan the trip" /></div>
        <div class="field"><label class="field-label" for="t-project">Project</label><select class="field-select" id="t-project"><option value="">— None —</option>${projectOptions}</select></div>
        <div class="field-row">
          <div class="field"><label class="field-label" for="t-type">Type</label><select class="field-select" id="t-type"><option ${type === 'Task' ? 'selected' : ''}>Task</option><option ${type === 'Project' ? 'selected' : ''}>Project</option></select></div>
          <div class="field"><label class="field-label" for="t-status">Status</label><select class="field-select" id="t-status">
            <option ${status === 'Backlog' ? 'selected' : ''}>Backlog</option>
            <option ${status === 'On Deck' ? 'selected' : ''}>On Deck</option>
            <option ${status === 'Tackling' ? 'selected' : ''}>Tackling</option>
            <option ${status === 'Done' ? 'selected' : ''}>Done</option>
          </select></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label" for="t-assigned">Assigned</label><select class="field-select" id="t-assigned">
            <option value="" ${!assigned ? 'selected' : ''}>—</option>
            <option ${assigned === 'Anjanette' ? 'selected' : ''}>Anjanette</option>
            <option ${assigned === 'Chanelle' ? 'selected' : ''}>Chanelle</option>
            <option ${assigned === 'Both' ? 'selected' : ''}>Both</option>
            <option ${assigned === 'Other' ? 'selected' : ''}>Other</option>
          </select></div>
          <div class="field" id="t-other-field" style="display:${assigned === 'Other' ? 'block' : 'none'}">
            <label class="field-label" for="t-other-name">Other name</label>
            <input class="field-input" id="t-other-name" value="${escapeAttr(otherAssignee)}" placeholder="Who?" />
          </div>
        </div>
        <div class="field"><label class="field-label" for="t-session-date">Session date</label><input class="field-input" id="t-session-date" type="date" value="${sessionDate}" /></div>
        <div class="field"><label class="field-label" for="t-notes">Notes</label><textarea class="field-textarea" id="t-notes" placeholder="Optional">${escapeHtml(notes)}</textarea></div>
        <div class="modal-actions">
          ${id ? '<button class="btn btn-danger" id="t-delete">Delete</button>' : '<span></span>'}
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="t-save">Save</button></div>
        </div>
      `);

      document.getElementById('t-assigned').addEventListener('change', e => {
        document.getElementById('t-other-field').style.display = e.target.value === 'Other' ? 'block' : 'none';
      });

      document.getElementById('t-save').addEventListener('click', async () => {
        const title = document.getElementById('t-title').value.trim();
        if (!title) { toast('Give it a title'); return; }
        const assignedVal = document.getElementById('t-assigned').value || null;
        const projectVal = document.getElementById('t-project').value;
        const fields = {
          [F.tasks.Name]: title,
          [F.tasks.Type]: document.getElementById('t-type').value,
          [F.tasks.Status]: document.getElementById('t-status').value,
          [F.tasks.Assigned]: assignedVal,
          [F.tasks.OtherAssignee]: assignedVal === 'Other' ? (document.getElementById('t-other-name').value.trim() || null) : null,
          [F.tasks.SessionDate]: document.getElementById('t-session-date').value || null,
          [F.tasks.Notes]: document.getElementById('t-notes').value.trim() || null,
        };
        if (F.tasks.Project) fields[F.tasks.Project] = projectVal ? [projectVal] : null;
        try {
          if (id) {
            const updated = await api('PATCH', 'Tasks', { id, body: { fields } });
            const idx = state.tasks.findIndex(t => t.id === id);
            if (idx >= 0) state.tasks[idx] = updated;
          } else {
            const created = await api('POST', 'Tasks', { body: { fields } });
            state.tasks.push(created);
          }
          closeModal();
          renderTasks();
          renderProjectsList();
          toast(id ? 'Saved' : 'Added');
        } catch (err) {
          console.error(err);
          toast('Save failed');
        }
      });

      if (id) {
        document.getElementById('t-delete').addEventListener('click', () => {
          closeModal();
          scheduleUndoableDelete({
            getArray: () => state.tasks,
            setArray: (arr) => { state.tasks = arr; },
            id,
            render: () => { renderTasks(); renderProjectsList(); },
            deleteApi: () => api('DELETE', 'Tasks', { id }),
            label: 'Task',
          });
        });
      }
    }

    function openSessionModal(id = null, defaultDate = null) {
      const session = id ? state.sessions.find(s => s.id === id) : null;
      const s = session || {};
      const title = f(s, F.sessions.Name) || '';
      const date = f(s, F.sessions.Date) || defaultDate || toISODate(today());
      const description = f(s, F.sessions.Description) || '';
      const sessProjectIds = F.sessions.Project ? (f(s, F.sessions.Project) || []) : [];
      const sessProjectId = Array.isArray(sessProjectIds) ? sessProjectIds[0] || '' : '';

      const sessProjectOptions = state.roadmap.map(r => {
        const rName = f(r, F.roadmap.Name) || 'Untitled';
        const sel = r.id === sessProjectId ? 'selected' : '';
        return `<option value="${r.id}" ${sel}>${escapeHtml(rName)}</option>`;
      }).join('');

      openModal(id ? 'Edit session' : 'New session', `
        <div class="field"><label class="field-label" for="e-title">Name</label><input class="field-input" id="e-title" value="${escapeAttr(title)}" placeholder="e.g. Planning session" /></div>
        <div class="field"><label class="field-label" for="e-date">Date</label><input class="field-input" id="e-date" type="date" value="${date}" /></div>
        <div class="field"><label class="field-label" for="e-project">Project</label><select class="field-select" id="e-project"><option value="">— None —</option>${sessProjectOptions}</select></div>
        <div class="field"><label class="field-label" for="e-notes">Description</label><textarea class="field-textarea" id="e-notes" placeholder="Optional">${escapeHtml(description)}</textarea></div>
        <div class="modal-actions">
          ${id ? '<button class="btn btn-danger" id="e-delete">Delete</button>' : '<span></span>'}
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="e-save">Save</button></div>
        </div>
      `);

      document.getElementById('e-save').addEventListener('click', async () => {
        const title = document.getElementById('e-title').value.trim();
        if (!title) { toast('Give it a name'); return; }
        const sessProjectVal = document.getElementById('e-project').value;
        const fields = {
          [F.sessions.Name]: title,
          [F.sessions.Date]: document.getElementById('e-date').value,
          [F.sessions.Description]: document.getElementById('e-notes').value.trim() || null,
        };
        if (F.sessions.Project) fields[F.sessions.Project] = sessProjectVal ? [sessProjectVal] : null;
        try {
          if (id) {
            const updated = await api('PATCH', 'Sessions', { id, body: { fields } });
            const idx = state.sessions.findIndex(ev => ev.id === id);
            if (idx >= 0) state.sessions[idx] = updated;
          } else {
            const created = await api('POST', 'Sessions', { body: { fields } });
            state.sessions.push(created);
          }
          closeModal();
          renderCalendar();
          renderDashboardSessions();
          toast(id ? 'Saved' : 'Added');
        } catch (err) { toast('Save failed'); }
      });

      if (id) {
        document.getElementById('e-delete').addEventListener('click', () => {
          closeModal();
          scheduleUndoableDelete({
            getArray: () => state.sessions,
            setArray: (arr) => { state.sessions = arr; },
            id,
            render: () => { renderCalendar(); renderDashboardSessions(); },
            deleteApi: () => api('DELETE', 'Sessions', { id }),
            label: 'Session',
          });
        });
      }
    }

    const PAGE_ALIASES = {};
    const PAGE_HASH_NAMES = {};
    const VALID_PAGES = ['dashboard', 'tasks', 'calendar', 'roadmap', 'projects'];

    function setPage(page, pushHash = true) {
      const resolved = PAGE_ALIASES[page] || page;
      if (!VALID_PAGES.includes(resolved)) return;
      state.currentPage = resolved;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${resolved}`).classList.add('active');
      document.querySelectorAll('.page-toggle button').forEach(b => b.classList.toggle('active', b.dataset.page === resolved));
      if (pushHash) {
        const hashName = PAGE_HASH_NAMES[resolved] || resolved;
        history.replaceState(null, '', `#${hashName}`);
      }
    }
    document.querySelectorAll('.page-toggle button[data-page]').forEach(b => {
      b.addEventListener('click', () => setPage(b.dataset.page));
    });

    function handleHash() {
      const raw = location.hash.replace('#', '').toLowerCase();
      if (raw) setPage(raw, false);
    }
    window.addEventListener('hashchange', handleHash);
    if (location.hash) handleHash();

    document.getElementById('cal-prev').addEventListener('click', () => {
      if (state.calView === 'week') {
        state.calDate = new Date(state.calDate.getTime() - 7 * DAY_MS);
      } else {
        state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth() - 1, 1);
      }
      renderCalendar();
    });
    document.getElementById('cal-next').addEventListener('click', () => {
      if (state.calView === 'week') {
        state.calDate = new Date(state.calDate.getTime() + 7 * DAY_MS);
      } else {
        state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth() + 1, 1);
      }
      renderCalendar();
    });
    document.querySelectorAll('.cal-view-toggle button').forEach(b => {
      b.addEventListener('click', () => {
        state.calView = b.dataset.view;
        document.querySelectorAll('.cal-view-toggle button').forEach(x => x.classList.toggle('active', x === b));
        renderCalendar();
      });
    });

    document.getElementById('fab').addEventListener('click', () => {
      if (state.currentPage === 'tasks' || state.currentPage === 'dashboard') openTaskModal();
      else if (state.currentPage === 'calendar') openSessionModal();
      else if (state.currentPage === 'roadmap' || state.currentPage === 'projects') openRoadmapModal();
    });
    document.getElementById('add-task-btn').addEventListener('click', () => openTaskModal());

    document.getElementById('task-search').addEventListener('input', e => {
      state.taskSearch = e.target.value;
      renderTasks();
    });

    (function initOpenTasksCollapse() {
      const body = document.getElementById('open-tasks-body');
      const chevron = document.getElementById('open-tasks-chevron');
      const saved = localStorage.getItem('familyhq.openTasksExpanded');
      let expanded = saved === 'true';
      function apply() {
        body.style.display = expanded ? 'block' : 'none';
        chevron.style.transform = expanded ? 'rotate(180deg)' : 'rotate(0deg)';
      }
      apply();
      document.getElementById('open-tasks-toggle').addEventListener('click', () => {
        expanded = !expanded;
        localStorage.setItem('familyhq.openTasksExpanded', expanded);
        apply();
      });
    })();

    // Roadmap — synced via Airtable (Roadmap table), grouped by Phase.
    function renderRoadmapFilters() {
      const chips = [
        { key: 'all', label: 'Everyone' },
        { key: 'Anjanette', label: 'Anjanette' },
        { key: 'Chanelle', label: 'Chanelle' },
        { key: 'Other', label: 'Other' },
      ];
      const wrap = document.getElementById('roadmap-filters');
      wrap.innerHTML = chips.map(c => {
        const active = state.roadmapFilter === c.key ? 'active' : '';
        const color = c.key !== 'all' ? personColor(c.key) : null;
        return `<button class="chip ${active}" data-filter="${c.key}">${color ? `<span class="chip-dot" style="--dot:${color}"></span>` : ''}${c.label}</button>`;
      }).join('');
      wrap.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          state.roadmapFilter = btn.dataset.filter;
          renderRoadmapFilters();
          renderRoadmap();
        });
      });
    }

    function matchesRoadmapFilter(item) {
      if (state.roadmapFilter === 'all') return true;
      return (f(item, F.roadmap.Assigned) || '') === state.roadmapFilter;
    }

    function roadmapMini(item) {
      const name = f(item, F.roadmap.Name) || 'Untitled';
      const desc = f(item, F.roadmap.Description) || '';
      const descShort = desc.length > 60 ? desc.slice(0, 57) + '…' : desc;
      const meta = assigneeMeta(item, F.roadmap.Assigned, F.roadmap.OtherAssignee);
      const styleVars = personCssVars(meta.colorName);
      return `
        <div class="task-mini" data-roadmap-id="${item.id}" style="${styleVars}">
          <div class="task-mini-body" style="grid-column: 1 / 3;">
            <div class="task-mini-title">${escapeHtml(name)}</div>
            <div class="task-mini-meta">
              ${descShort ? `<span>${escapeHtml(descShort)}</span>${meta.label ? '<span class="task-meta-sep"></span>' : ''}` : ''}
              ${meta.label ? `<span>${escapeHtml(meta.label)}</span>` : ''}
            </div>
          </div>
          ${meta.label ? `<div class="task-mini-avatar" title="${escapeAttr(meta.label)}">${escapeHtml(meta.avatarInitials)}</div>` : ''}
        </div>
      `;
    }

    function renderRoadmap() {
      const items = state.roadmap.filter(matchesRoadmapFilter);
      const groups = { Now: [], Next: [], Future: [] };
      items.forEach(item => {
        const phase = f(item, F.roadmap.Phase) || 'Future';
        (groups[phase] || groups.Future).push(item);
      });
      const sortByName = (a, b) => (f(a, F.roadmap.Name) || '').localeCompare(f(b, F.roadmap.Name) || '');
      Object.values(groups).forEach(list => list.sort(sortByName));

      const meta = [
        { key: 'Now', cls: 'bucket-today' },
        { key: 'Next', cls: 'bucket-week' },
        { key: 'Future', cls: 'bucket-later' },
      ];

      const wrap = document.getElementById('roadmap-list');
      wrap.innerHTML = `<div class="buckets-grid">${meta.map(m => {
        const list = groups[m.key];
        const collapsed = state.roadmapCollapsed?.[m.key] ? ' collapsed' : '';
        const body = list.length === 0
          ? `<div class="bucket-empty">Nothing here</div>`
          : list.map(roadmapMini).join('');
        return `
          <div class="bucket ${m.cls}${collapsed}" id="roadmap-${m.key}">
            <div class="bucket-head" onclick="toggleRoadmapSection('${m.key}')">
              <span class="bucket-title">${m.key}</span>
              <span class="bucket-count">${list.length}</span>
              <span class="roadmap-section-toggle">&#9660;</span>
            </div>
            <div class="bucket-body"><div class="bucket-body-inner">${body}</div></div>
          </div>
        `;
      }).join('')}</div>`;

      wrap.querySelectorAll('[data-roadmap-id]').forEach(el => {
        el.addEventListener('click', () => openRoadmapModal(el.dataset.roadmapId));
      });
    }

    function toggleRoadmapSection(key) {
      if (!state.roadmapCollapsed) state.roadmapCollapsed = {};
      state.roadmapCollapsed[key] = !state.roadmapCollapsed[key];
      const section = document.getElementById('roadmap-' + key);
      if (section) section.classList.toggle('collapsed');
    }

    function getTasksForProject(projectId) {
      if (!F.tasks.Project) return [];
      return state.tasks.filter(t => {
        const linked = f(t, F.tasks.Project);
        return Array.isArray(linked) && linked.includes(projectId);
      });
    }

    function renderProjectsFilters() {
      const chips = [
        { key: 'all', label: 'Everyone' },
        { key: 'Anjanette', label: 'Anjanette' },
        { key: 'Chanelle', label: 'Chanelle' },
        { key: 'Other', label: 'Other' },
      ];
      const wrap = document.getElementById('projects-filters');
      if (!wrap) return;
      wrap.innerHTML = chips.map(c => {
        const active = state.projectsFilter === c.key ? 'active' : '';
        const color = c.key !== 'all' ? personColor(c.key) : null;
        return `<button class="chip ${active}" data-filter="${c.key}">${color ? `<span class="chip-dot" style="--dot:${color}"></span>` : ''}${c.label}</button>`;
      }).join('');
      wrap.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          state.projectsFilter = btn.dataset.filter;
          renderProjectsFilters();
          renderProjectsList();
        });
      });
    }

    function matchesProjectsFilter(item) {
      if (state.projectsFilter === 'all') return true;
      return (f(item, F.roadmap.Assigned) || '') === state.projectsFilter;
    }

    function renderProjectsList() {
      const items = state.roadmap.filter(matchesProjectsFilter);
      const phaseOrder = { Now: 0, Next: 1, Future: 2 };
      const sorted = [...items].sort((a, b) => {
        const pa = phaseOrder[f(a, F.roadmap.Phase)] ?? 2;
        const pb = phaseOrder[f(b, F.roadmap.Phase)] ?? 2;
        if (pa !== pb) return pa - pb;
        return (f(a, F.roadmap.Name) || '').localeCompare(f(b, F.roadmap.Name) || '');
      });

      const wrap = document.getElementById('projects-list');
      document.getElementById('projects-count').textContent = state.roadmap.length;
      if (sorted.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">📋</div><div class="empty-title">No projects yet</div>Use the + button or the Roadmap tab to add one.</div>`;
        return;
      }

      wrap.innerHTML = sorted.map(item => {
        const name = f(item, F.roadmap.Name) || 'Untitled';
        const phase = f(item, F.roadmap.Phase) || 'Future';
        const desc = f(item, F.roadmap.Description) || '';
        const meta = assigneeMeta(item, F.roadmap.Assigned, F.roadmap.OtherAssignee);
        const tasks = getTasksForProject(item.id);
        const collapsed = state.projectListCollapsed?.[item.id] ? ' collapsed' : '';

        const statusOrder = { 'Tackling': 0, 'On Deck': 1, 'Backlog': 2, 'Done': 3 };
        const sortedTasks = [...tasks].sort((a, b) => {
          const as = statusOrder[f(a, F.tasks.Status)] ?? 4;
          const bs = statusOrder[f(b, F.tasks.Status)] ?? 4;
          return as - bs;
        });

        const taskRows = sortedTasks.length > 0
          ? sortedTasks.map(t => {
              const tName = f(t, F.tasks.Name) || 'Untitled';
              const tStatus = (f(t, F.tasks.Status) || 'Backlog').toLowerCase().replace(/\s+/g, '-');
              return `<div class="project-task-row" data-task-id="${t.id}"><span class="project-task-dot ${tStatus}"></span><span>${escapeHtml(tName)}</span></div>`;
            }).join('')
          : `<div style="font-size:12px;color:var(--ink-subtle);padding:4px 0;font-style:italic">${F.tasks.Project ? 'No tasks linked yet' : 'Link tasks after adding the Project field in Airtable'}</div>`;

        return `
          <div class="project-card${collapsed}" data-project-card="${item.id}">
            <div class="project-card-head" data-project-toggle="${item.id}">
              ${meta.label ? `<div class="task-mini-avatar" style="${personCssVars(meta.colorName)}" title="${escapeAttr(meta.label)}">${escapeHtml(meta.avatarInitials)}</div>` : ''}
              <div class="project-card-name">${escapeHtml(name)}</div>
              <span class="project-card-phase ${phase.toLowerCase()}">${phase}</span>
              <span class="project-card-toggle">&#9660;</span>
            </div>
            <div class="project-card-body"><div class="project-card-body-inner">
              ${desc ? `<div class="project-card-desc">${escapeHtml(desc)}</div>` : ''}
              <div class="project-card-tasks">
                <div class="project-card-tasks-label"><span>Tasks ${sortedTasks.length > 0 ? `(${sortedTasks.length})` : ''}</span></div>
                ${taskRows}
                <button class="project-add-task" data-add-task-project="${item.id}">+ Add task</button>
              </div>
            </div></div>
          </div>
        `;
      }).join('');

      wrap.querySelectorAll('[data-project-toggle]').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.closest('[data-task-id]') || e.target.closest('[data-add-task-project]')) return;
          const pid = el.dataset.projectToggle;
          if (!state.projectListCollapsed) state.projectListCollapsed = {};
          state.projectListCollapsed[pid] = !state.projectListCollapsed[pid];
          const card = document.querySelector(`[data-project-card="${pid}"]`);
          if (card) card.classList.toggle('collapsed');
        });
      });

      wrap.querySelectorAll('[data-task-id]').forEach(el => {
        el.addEventListener('click', () => openTaskModal(el.dataset.taskId));
      });

      wrap.querySelectorAll('[data-add-task-project]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          openTaskModal(null, el.dataset.addTaskProject);
        });
      });

      wrap.querySelectorAll('.project-card-name').forEach(el => {
        const card = el.closest('.project-card');
        if (!card) return;
        const pid = card.dataset.projectCard;
        el.addEventListener('dblclick', e => {
          e.stopPropagation();
          openRoadmapModal(pid);
        });
      });
    }

    document.getElementById('roadmap-add-btn-top').addEventListener('click', () => openRoadmapModal());
    document.getElementById('projects-add-btn').addEventListener('click', () => openRoadmapModal());

    async function addRoadmapItem() {
      const input = document.getElementById('roadmap-new-item');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const fields = { [F.roadmap.Name]: text, [F.roadmap.Phase]: 'Now' };
      try {
        const created = await api('POST', 'Roadmap', { body: { fields } });
        state.roadmap.push(created);
        renderRoadmap();
        renderProjectsList();
      } catch (err) {
        console.error(err);
        toast('Add failed');
      }
    }
    document.getElementById('roadmap-add-btn').addEventListener('click', addRoadmapItem);
    document.getElementById('roadmap-new-item').addEventListener('keydown', e => { if (e.key === 'Enter') addRoadmapItem(); });

    function openRoadmapModal(id = null) {
      const item = id ? state.roadmap.find(r => r.id === id) : null;
      const r = item || {};
      const name = f(r, F.roadmap.Name) || '';
      const phase = f(r, F.roadmap.Phase) || 'Future';
      const description = f(r, F.roadmap.Description) || '';
      const assigned = f(r, F.roadmap.Assigned) || '';
      const otherAssignee = f(r, F.roadmap.OtherAssignee) || '';

      openModal(id ? 'Edit project' : 'New project', `
        <div class="field"><label class="field-label" for="r-name">Name</label><input class="field-input" id="r-name" value="${escapeAttr(name)}" placeholder="e.g. Plan Italy trip" /></div>
        <div class="field-row">
          <div class="field"><label class="field-label" for="r-phase">Phase</label><select class="field-select" id="r-phase">
            <option ${phase === 'Now' ? 'selected' : ''}>Now</option>
            <option ${phase === 'Next' ? 'selected' : ''}>Next</option>
            <option ${phase === 'Future' ? 'selected' : ''}>Future</option>
          </select></div>
          <div class="field"><label class="field-label" for="r-assigned">Assigned</label><select class="field-select" id="r-assigned">
            <option value="" ${!assigned ? 'selected' : ''}>—</option>
            <option ${assigned === 'Anjanette' ? 'selected' : ''}>Anjanette</option>
            <option ${assigned === 'Chanelle' ? 'selected' : ''}>Chanelle</option>
            <option ${assigned === 'Both' ? 'selected' : ''}>Both</option>
            <option ${assigned === 'Other' ? 'selected' : ''}>Other</option>
          </select></div>
        </div>
        <div class="field" id="r-other-field" style="display:${assigned === 'Other' ? 'block' : 'none'}">
          <label class="field-label" for="r-other-name">Other name</label>
          <input class="field-input" id="r-other-name" value="${escapeAttr(otherAssignee)}" placeholder="Who?" />
        </div>
        <div class="field"><label class="field-label" for="r-desc">Description</label><textarea class="field-textarea" id="r-desc" placeholder="Optional">${escapeHtml(description)}</textarea></div>
        <div class="modal-actions">
          ${id ? '<button class="btn btn-danger" id="r-delete">Delete</button>' : '<span></span>'}
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="r-save">Save</button></div>
        </div>
      `);

      document.getElementById('r-assigned').addEventListener('change', e => {
        document.getElementById('r-other-field').style.display = e.target.value === 'Other' ? 'block' : 'none';
      });

      document.getElementById('r-save').addEventListener('click', async () => {
        const name = document.getElementById('r-name').value.trim();
        if (!name) { toast('Give it a name'); return; }
        const assignedVal = document.getElementById('r-assigned').value || null;
        const fields = {
          [F.roadmap.Name]: name,
          [F.roadmap.Phase]: document.getElementById('r-phase').value,
          [F.roadmap.Description]: document.getElementById('r-desc').value.trim() || null,
          [F.roadmap.Assigned]: assignedVal,
          [F.roadmap.OtherAssignee]: assignedVal === 'Other' ? (document.getElementById('r-other-name').value.trim() || null) : null,
        };
        try {
          if (id) {
            const updated = await api('PATCH', 'Roadmap', { id, body: { fields } });
            const idx = state.roadmap.findIndex(x => x.id === id);
            if (idx >= 0) state.roadmap[idx] = updated;
          } else {
            const created = await api('POST', 'Roadmap', { body: { fields } });
            state.roadmap.push(created);
          }
          closeModal();
          renderRoadmap();
          renderProjectsList();
          toast(id ? 'Saved' : 'Added');
        } catch (err) {
          console.error(err);
          toast('Save failed');
        }
      });

      if (id) {
        document.getElementById('r-delete').addEventListener('click', () => {
          closeModal();
          scheduleUndoableDelete({
            getArray: () => state.roadmap,
            setArray: (arr) => { state.roadmap = arr; },
            id,
            render: () => { renderRoadmap(); renderProjectsList(); },
            deleteApi: () => api('DELETE', 'Roadmap', { id }),
            label: 'Project',
          });
        });
      }
    }

    renderRoadmapFilters();
    renderRoadmap();

    // Notes — needs a Notes table (Message, Author, Created) in Airtable to sync.
    function renderNotes() {
      const wrap = document.getElementById('note-list');
      if (!AIRTABLE_TABLE_IDS.Notes) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">💬</div><div class="empty-title">Not set up yet</div>Add a Notes table in Airtable, then ask Claude to finish wiring it up.</div>`;
        return;
      }
      if (state.notes.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">💬</div><div class="empty-title">No notes yet</div>Leave a note above.</div>`;
        return;
      }
      const sorted = [...state.notes].sort((a, b) => (f(b, F.notes.Created) || '').localeCompare(f(a, F.notes.Created) || ''));
      wrap.innerHTML = sorted.map(m => {
        const text = f(m, F.notes.Message) || '';
        const author = f(m, F.notes.Author) || '';
        const created = f(m, F.notes.Created);
        const dateLabel = created ? (() => { const d = parseISODate(created); return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`; })() : '';
        const meta = [author, dateLabel].filter(Boolean).join(' · ');
        return `
          <div class="grocery-item" style="align-items:flex-start">
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;color:var(--ink)">${escapeHtml(text)}</div>
              ${meta ? `<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted);margin-top:3px">${escapeHtml(meta)}</div>` : ''}
            </div>
            <button class="grocery-item-delete" data-action="note-delete" data-item-id="${m.id}" aria-label="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        `;
      }).join('');
      wrap.querySelectorAll('[data-action="note-delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteNote(btn.dataset.itemId));
      });
    }

    async function postNote() {
      const input = document.getElementById('note-new-text');
      const authorSel = document.getElementById('note-author');
      const text = input.value.trim();
      if (!text) return;
      if (!AIRTABLE_TABLE_IDS.Notes) { toast('Notes table not set up yet'); return; }
      input.value = '';
      const fields = { [F.notes.Message]: text, [F.notes.Created]: toISODate(today()) };
      if (authorSel.value) fields[F.notes.Author] = authorSel.value;
      try {
        const created = await api('POST', 'Notes', { body: { fields } });
        state.notes.push(created);
        renderNotes();
      } catch (err) {
        console.error(err);
        toast('Post failed');
      }
    }

    function deleteNote(id) {
      scheduleUndoableDelete({
        getArray: () => state.notes,
        setArray: (arr) => { state.notes = arr; },
        id,
        render: renderNotes,
        deleteApi: () => api('DELETE', 'Notes', { id }),
        label: 'Note',
      });
    }

    document.getElementById('note-add-btn').addEventListener('click', postNote);
    document.getElementById('note-new-text').addEventListener('keydown', e => { if (e.key === 'Enter') postNote(); });
    renderNotes();

    function renderDashboardSessions() {
      const start = today();
      const items = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        eventsForDate(d).forEach(e => items.push(e));
      }
      const wrap = document.getElementById('dashboard-sessions');
      if (items.length === 0) {
        const pastSessions = state.sessions.filter(s => f(s, F.sessions.Date)).sort((a, b) => new Date(f(b, F.sessions.Date)) - new Date(f(a, F.sessions.Date)));
        if (pastSessions.length > 0) {
          const last = pastSessions[0];
          const lastDate = parseISODate(f(last, F.sessions.Date));
          const daysAgo = daysBetween(lastDate, start);
          const title = f(last, F.sessions.Name) || 'Untitled';
          const description = f(last, F.sessions.Description) || '';
          wrap.innerHTML = `
            <div class="upcoming-item" style="--dot-color:var(--ink-muted)">
              <div class="upcoming-date">
                <div class="upcoming-date-day">${lastDate.getDate()}</div>
                <div class="upcoming-date-month">${MONTH_SHORT[lastDate.getMonth()]}</div>
              </div>
              <div class="upcoming-body">
                <div class="upcoming-title">${escapeHtml(title)}</div>
                <div class="upcoming-sub">Last session &middot; ${daysAgo === 0 ? 'Today' : daysAgo + 'd ago'}</div>
              </div>
            </div>
          `;
        } else {
          wrap.innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><div class="empty-title">Nothing this week</div></div>`;
        }
        return;
      }
      wrap.innerHTML = items.map(upcomingItem).join('');
    }

    function renderAll() {
      renderTaskFilters();
      renderTasks();
      renderCalendar();
      renderRoadmap();
      renderProjectsFilters();
      renderProjectsList();
      renderDashboardSessions();
      renderNotes();
    }

    let pollTimer;
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (document.visibilityState === 'visible') loadAll();
      }, POLL_MS);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadAll();
      }
    });

    function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(s) { return escapeHtml(s); }

    loadAll().then(() => { startPolling(); });
  </script>
</body>
</html>
