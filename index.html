<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F0F4FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
  <title>Day for Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: 'Outfit', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --deep: #1E3A8A;
      --sky: #60A5FA;
      --pink: #EC4899;
      --pop: #F59E0B;
      --green: #059669;
      --red: #DC2626;

      --person-Anjanette: var(--pink);
      --person-Chanelle: var(--sky);
      --person-Both: var(--primary);
      --person-Other: var(--pop);

      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 18px;
      --transition: 150ms ease;
    }

    html[data-theme="dark"] {
      --primary: #60A5FA;
      --primary-hover: #3B82F6;
      --deep: #2563EB;
      --sky: #93C5FD;
      --pink: #F472B6;
      --pop: #FDE68A;
      --green: #34D399;
      --red: #F87171;

      --bg-base: #0B1120;
      --surface: #111827;
      --surface-2: #1E293B;
      --surface-strong: #273548;
      --surface-solid: #111827;

      --ink: #F1F5F9;
      --ink-2: #CBD5E1;
      --ink-muted: #94A3B8;
      --ink-subtle: #64748B;

      --border: #1E293B;
      --border-strong: #334155;
      --hover: #162032;
      --scrim: rgba(0, 0, 0, 0.7);
    }

    html[data-theme="light"] {
      --bg-base: #F0F4FF;
      --surface: #ffffff;
      --surface-2: #E8EDFB;
      --surface-strong: #DAE0F2;
      --surface-solid: #ffffff;

      --ink: #0F172A;
      --ink-2: #334155;
      --ink-muted: #64748B;
      --ink-subtle: #94A3B8;

      --border: #CBD5E1;
      --border-strong: #B0BDD0;
      --hover: #E2E8F8;
      --scrim: rgba(10, 10, 10, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      background: var(--bg-base);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
    input, textarea, select { font: inherit; color: inherit; }

    .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; }
    @media (min-width: 768px) { .app { padding: 32px 32px 60px; } }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .sync-status.syncing .sync-dot { background: var(--primary); }
    .sync-status.error .sync-dot { background: var(--red); }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink-2);
      transition: var(--transition);
    }
    .icon-btn:hover { background: var(--hover); border-color: var(--border-strong); }
    .icon-btn svg { width: 17px; height: 17px; }
    html[data-theme="dark"] .icon-sun { display: block; }
    html[data-theme="dark"] .icon-moon { display: none; }
    html[data-theme="light"] .icon-sun { display: none; }
    html[data-theme="light"] .icon-moon { display: block; }

    /* Page toggle */
    .page-toggle {
      display: inline-flex;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .page-toggle::-webkit-scrollbar { display: none; }
    .page-toggle button {
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .page-toggle button.active { color: white; background: var(--primary); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .card + .card { margin-top: 14px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
    .card-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title-count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--ink-2);
    }
    .card-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat {
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--stat-color, var(--ink));
      border-radius: 10px;
    }
    .stat-num { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; color: var(--stat-color, var(--ink)); }
    .stat-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
    .streak-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .streak-pill {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
      font-size: 12px; color: var(--ink-2);
    }
    .streak-pill-num { font-family: var(--font-display); font-weight: 700; color: var(--primary); }

    /* Filter chips */
    .filter-row { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .chip:hover { color: var(--ink); border-color: var(--border-strong); }
    .chip.active { color: white; background: var(--primary); border-color: var(--primary); }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--ink-muted)); }

    /* Buckets */
    .buckets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 560px) { .buckets-grid { grid-template-columns: 1fr; } }
    .bucket { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .bucket-overdue { border-left: 3px solid var(--red); }
    .bucket-today { border-left: 3px solid var(--primary); }
    .bucket-week { border-left: 3px solid var(--green); }
    .bucket-later { border-left: 3px solid var(--border-strong); }
    .bucket-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px; }
    .bucket-title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-muted); font-weight: 600; }
    .bucket-overdue .bucket-title { color: var(--red); }
    .bucket-today .bucket-title { color: var(--primary); }
    .bucket-week .bucket-title { color: var(--green); }
    .bucket-count { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; background: var(--surface-strong); border-radius: 999px; color: var(--ink-2); }
    .task-mini {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      padding: 9px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      align-items: center;
      transition: var(--transition);
    }
    .task-mini:hover { border-color: var(--border-strong); }
    .task-mini-check {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); flex-shrink: 0;
    }
    .task-mini-check:hover { border-color: var(--primary); }
    .task-mini-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }
    .task-mini-title { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-mini-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
    .task-mini.overdue .task-mini-meta-due { color: var(--red); font-weight: 600; }
    .task-mini-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; font-family: var(--font-display);
      background: var(--person-color, var(--surface-strong));
      color: white;
      flex-shrink: 0;
    }
    .bucket-empty { font-size: 12px; color: var(--ink-subtle); padding: 10px 4px; text-align: center; font-style: italic; }
    .bucket-more { font-size: 11px; color: var(--ink-muted); font-family: var(--font-mono); padding: 4px 4px 0; text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }

    #roadmap-list .bucket-head { cursor: pointer; user-select: none; }
    #roadmap-list .bucket-head:hover { opacity: 0.8; }
    .roadmap-section-toggle {
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--ink-muted); transition: transform var(--transition);
      margin-left: auto; flex-shrink: 0;
    }
    .bucket.collapsed .roadmap-section-toggle { transform: rotate(-90deg); }
    .bucket-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 300ms ease; }
    .bucket.collapsed .bucket-body { grid-template-rows: 0fr; }
    .bucket-body-inner { overflow: hidden; display: flex; flex-direction: column; gap: 6px; }

    #roadmap-list .buckets-grid { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 768px) { #roadmap-list .buckets-grid { grid-template-columns: 1fr; } }

    .projects-view-toggle { display: flex; gap: 4px; }
    .projects-view-toggle button { padding: 5px 14px; border-radius: 8px; font-family: var(--font-display); font-weight: 600; font-size: 12px; color: var(--ink-muted); background: transparent; border: 1px solid var(--border); transition: var(--transition); }
    .projects-view-toggle button.active { color: white; background: var(--primary); border-color: var(--primary); }

    .project-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .project-card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; border-radius: 12px; transition: var(--transition); }
    .project-card-head:hover { background: var(--hover); }
    .project-card-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-card-phase { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
    .project-card-phase.now { background: rgba(59,130,246,0.15); color: var(--primary); }
    .project-card-phase.next { background: rgba(5,150,105,0.15); color: var(--green); }
    .project-card-phase.future { background: var(--surface-strong); color: var(--ink-muted); }
    .project-card-desc { font-size: 13px; color: var(--ink-muted); padding: 0 16px 10px; line-height: 1.5; }
    .project-card-tasks { border-top: 1px solid var(--border); padding: 10px 16px 14px; }
    .project-card-tasks-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .project-task-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; cursor: pointer; transition: var(--transition); }
    .project-task-row:hover { color: var(--primary); }
    .project-task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .project-task-dot.tackling { background: var(--primary); }
    .project-task-dot.on-deck { background: var(--green); }
    .project-task-dot.backlog { background: var(--ink-subtle); }
    .project-task-dot.done { background: var(--green); opacity: 0.5; }
    .project-add-task { font-family: var(--font-display); font-weight: 600; font-size: 12px; color: var(--primary); padding: 6px 0; display: inline-flex; align-items: center; gap: 4px; }
    .project-add-task:hover { text-decoration: underline; }
    .project-card-toggle { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--ink-muted); transition: transform 200ms ease; flex-shrink: 0; }
    .project-card.collapsed .project-card-toggle { transform: rotate(-90deg); }
    .project-card-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 300ms ease; }
    .project-card.collapsed .project-card-body { grid-template-rows: 0fr; }
    .project-card-body-inner { overflow: hidden; }

    /* Task table */
    .task-table { display: flex; flex-direction: column; gap: 4px; }
    .task-table-head, .task-table-row {
      display: grid;
      grid-template-columns: 1fr 120px 90px 100px 32px;
      gap: 10px;
      padding: 10px 12px;
      align-items: center;
    }
    .task-table-head {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 2px;
    }
    .task-table-row {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
    }
    .task-table-row:hover { border-color: var(--border-strong); }
    .task-table-row.overdue-row { border-left: 3px solid var(--red); }
    .tt-title { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tt-cell { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tt-assigned { display: flex; align-items: center; gap: 7px; }
    .tt-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; font-family: var(--font-display);
      background: var(--person-color, var(--surface-strong));
      color: white;
      flex-shrink: 0;
    }
    .tt-type-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .tt-type-tag.chore, .tt-type-tag.task { background: var(--surface-strong); color: var(--ink-2); }
    .tt-type-tag.project { background: rgba(236, 72, 153, 0.15); color: var(--pink); }
    .tt-due-overdue { color: var(--red); font-weight: 600; }
    .tt-check {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
    }
    .tt-check:hover { border-color: var(--primary); }
    .tt-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }

    @media (max-width: 720px) {
      .task-table-head { display: none; }
      .task-table-row {
        grid-template-columns: 1fr auto;
        grid-template-areas: "title check" "meta meta";
        gap: 5px 10px;
        padding: 10px 12px;
      }
      .tt-title { grid-area: title; }
      .tt-check { grid-area: check; align-self: start; }
      .tt-meta-row { grid-area: meta; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    }

    /* Task list (calendar day modal) */
    .empty { padding: 32px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 10px; }
    .empty-emoji { font-size: 24px; margin-bottom: 6px; }
    .empty-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .event-row-editable:hover { background: var(--hover); }

    /* Groceries */
    .grocery-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 6px;
    }
    .grocery-item.checked .grocery-item-text { text-decoration: line-through; color: var(--ink-muted); }
    .grocery-item-text {
      flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis;
      border: none; background: transparent; padding: 4px 2px; border-radius: 6px; color: var(--ink); font-family: inherit;
    }
    .grocery-item-text:focus { outline: none; background: var(--surface-strong); }
    .grocery-item-check {
      width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: var(--transition);
    }
    .grocery-item-check:hover { border-color: var(--primary); }
    .grocery-item-check svg { width: 10px; height: 10px; stroke: transparent; stroke-width: 3; }
    .grocery-item.checked .grocery-item-check { background: var(--green); border-color: var(--green); }
    .grocery-item.checked .grocery-item-check svg { stroke: white; }
    .grocery-item-delete {
      width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--ink-muted); flex-shrink: 0; transition: var(--transition);
    }
    .grocery-item-delete:hover { color: var(--red); background: var(--hover); }
    .grocery-category-label {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted);
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
      padding: 14px 4px 6px;
    }
    .grocery-category-label:first-child { padding-top: 2px; }
    .grocery-item-cat {
      font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 6px; max-width: 108px; flex-shrink: 0;
    }
    .grocery-item-cat:focus { outline: none; border-color: var(--primary); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
      transition: var(--transition);
      z-index: 50;
    }
    .fab:hover { transform: translateY(-2px); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 22px; height: 22px; }

    /* Calendar */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
    .cal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
    .cal-title-year { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); font-weight: 400; }
    .cal-arrow {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2); transition: var(--transition);

    /* Week view */
    .cal-week { display: flex; flex-direction: column; gap: 8px; }

      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: start;

    .cal-week-day.today { border-left: 3px solid var(--primary); }
    .cal-week-day-label { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
    .cal-week-day-name { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
    .cal-week-day.today .cal-week-day-name { color: var(--primary); }

      display: flex; align-items: center; gap: 9px;

    .modal-scrim {

    .field-input, .field-select, .field-textarea {

    @media (max-width: 480px) {

    @media (prefers-reduced-motion: reduce) {

    }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  </style>
</head>

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('familyhq.theme', next);
    });

    (function initFontScale() {
      const saved = parseInt(localStorage.getItem('familyhq.fontScalePct'), 10);
      const pct = Number.isInteger(saved) ? saved : 100;
      document.documentElement.style.zoom = pct / 100;
    })();
    function openFontScaleModal() {
      const current = Math.round(parseFloat(document.documentElement.style.zoom || '1') * 100);
