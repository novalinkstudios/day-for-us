      { name: 'International & Ethnic', keywords: ['salsa','curry','taco kit','soy sauce ethnic','tortilla chips'] },
      { name: 'Jams & Preserves', keywords: ['jam','jelly','preserves','marmalade','honey','peanut butter'] },
      { name: 'Juices', keywords: ['juice','orange juice','apple juice','cranberry juice'] },
      { name: 'Kosher', keywords: ['kosher'] },
      { name: 'Meat & Poultry', keywords: ['chicken','beef','turkey','pork','ham','sausage','bacon','ground beef','steak'] },
      { name: 'Nuts', keywords: ['almond','peanut','cashew','walnut','pecan','pistachio','trail mix'] },
      { name: 'Oil & Vinegar', keywords: ['olive oil','vegetable oil','vinegar','cooking spray'] },
      { name: 'Paper Products', keywords: ['paper towel','toilet paper','napkin','tissue','paper plate'] },
      { name: 'Pasta & Noodles', keywords: ['pasta','spaghetti','noodle','macaroni','lasagna'] },
      { name: 'Pet Food', keywords: ['dog food','cat food','pet treat','pet food'] },
      { name: 'Seafood', keywords: ['shrimp','salmon','fish','tilapia','crab','tuna fresh'] },
      { name: 'Soups and Broth', keywords: ['soup','broth','stock chicken','stock beef'] },
      { name: 'Special Equipment', keywords: ['foil','plastic wrap','ziploc','storage bags','parchment paper'] },
      { name: 'Spices', keywords: ['salt','pepper black','cinnamon','paprika','cumin','oregano','seasoning','spice'] },
      { name: 'Water', keywords: ['water','sparkling water','bottled water'] },
      { name: 'Wine & Spirits', keywords: ['wine','vodka','whiskey','rum','tequila','liquor'] },
    ];
    function inferCategory(name) {
      const lower = (name || '').toLowerCase();
      for (const cat of AISLE_CATEGORIES) {
        if (cat.keywords.some(k => lower.includes(k))) return cat.name;
      }
      return 'Unsorted';
    }
    function loadCategoryOverrides() {
      try { return JSON.parse(localStorage.getItem('familyhq.groceryCategoryOverrides') || '{}'); }
      catch (e) { return {}; }
    }
    function setCategoryOverride(itemId, categoryName) {
      const map = loadCategoryOverrides();
      if (categoryName) map[itemId] = categoryName;
      else delete map[itemId];
      localStorage.setItem('familyhq.groceryCategoryOverrides', JSON.stringify(map));
    }
    function getCategoryFor(item) {
      const overrides = loadCategoryOverrides();
      if (overrides[item.id]) return overrides[item.id];
      return inferCategory(f(item, F.groceries.Item) || '');
    }
    const ALL_CATEGORY_NAMES = [...AISLE_CATEGORIES.map(c => c.name), 'Unsorted'];

    function groceryItemRow(item) {
      const checked = !!f(item, F.groceries.Checked);
      const text = f(item, F.groceries.Item) || '';
      const category = getCategoryFor(item);
      return `
        <div class="grocery-item ${checked ? 'checked' : ''}">
          <button class="grocery-item-check" data-action="grocery-check" data-item-id="${item.id}" aria-label="Toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <input class="grocery-item-text" data-action="grocery-edit" data-item-id="${item.id}" value="${escapeAttr(text)}" />
          <select class="grocery-item-cat" data-action="grocery-cat" data-item-id="${item.id}" aria-label="Aisle">
            ${ALL_CATEGORY_NAMES.map(c => `<option value="${escapeAttr(c)}" ${c === category ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
          </select>
          <button class="grocery-item-delete" data-action="grocery-delete" data-item-id="${item.id}" aria-label="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      `;
    }

    function wireGroceryRowListeners(wrap) {
      wrap.querySelectorAll('[data-action="grocery-check"]').forEach(btn => {
        btn.addEventListener('click', () => toggleGroceryItem(btn.dataset.itemId));
      });
      wrap.querySelectorAll('[data-action="grocery-delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteGroceryItem(btn.dataset.itemId));
      });
      wrap.querySelectorAll('[data-action="grocery-edit"]').forEach(inp => {
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
        inp.addEventListener('blur', () => editGroceryItem(inp.dataset.itemId, inp.value));
      });
      wrap.querySelectorAll('[data-action="grocery-cat"]').forEach(sel => {
        sel.addEventListener('change', () => {
          setCategoryOverride(sel.dataset.itemId, sel.value);
          renderGroceryList();
        });
      });
    }

    function renderGroceryList() {
      const items = state.groceries.filter(g => {
        const stores = groceryStoreOf(g);
        if (stores.includes('Anywhere')) return true;
        return stores.includes(state.groceryStore);
      });
      const wrap = document.getElementById('grocery-list');
      if (items.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">🛒</div><div class="empty-title">Nothing yet</div>Add items above.</div>`;
        return;
      }

      const unchecked = items.filter(i => !f(i, F.groceries.Checked));
      const checked = items.filter(i => f(i, F.groceries.Checked));

      const groups = {};
      unchecked.forEach(item => {
        const cat = getCategoryFor(item);
        (groups[cat] = groups[cat] || []).push(item);
      });
      Object.values(groups).forEach(list => list.sort((a, b) => (f(a, F.groceries.Item) || '').localeCompare(f(b, F.groceries.Item) || '')));

      let html = '';
      ALL_CATEGORY_NAMES.forEach(catName => {
        const groupItems = groups[catName];
        if (!groupItems || groupItems.length === 0) return;
        html += `<div class="grocery-category-label">${escapeHtml(catName)}</div>`;
        html += groupItems.map(groceryItemRow).join('');
      });
      if (checked.length > 0) {
        html += `<div class="grocery-category-label">Checked</div>`;
        html += checked.map(groceryItemRow).join('');
      }

      wrap.innerHTML = html;
      wireGroceryRowListeners(wrap);
    }

    async function editGroceryItem(id, newText) {
      const item = state.groceries.find(i => i.id === id);
      if (!item) return;
      const trimmed = newText.trim();
      const current = f(item, F.groceries.Item) || '';
      if (!trimmed || trimmed === current) { renderGroceryList(); return; }
      item.fields[F.groceries.Item] = trimmed;
      try {
        await api('PATCH', 'Groceries', { id, body: { fields: { [F.groceries.Item]: trimmed } } });
      } catch (err) {
        console.error(err);
        toast('Save failed');
        loadAll();
      }
    }

    async function toggleGroceryItem(id) {
      const item = state.groceries.find(i => i.id === id);
      if (!item) return;
      const newVal = !f(item, F.groceries.Checked);
      item.fields[F.groceries.Checked] = newVal;
      renderGroceryList();
      try {
        await api('PATCH', 'Groceries', { id, body: { fields: { [F.groceries.Checked]: newVal } } });
      } catch (err) {
        console.error(err);
        toast('Sync failed');
        loadAll();
      }
    }

    function deleteGroceryItem(id) {
      scheduleUndoableDelete({
        getArray: () => state.groceries,
        setArray: (arr) => { state.groceries = arr; },
        id,
        render: renderGroceryList,
        deleteApi: () => api('DELETE', 'Groceries', { id }),
        label: 'Item',
      });
    }

    async function addGroceryItem() {
      const input = document.getElementById('grocery-new-item');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const fields = { [F.groceries.Item]: text, [F.groceries.Store]: [state.groceryStore] };
      try {
        const created = await api('POST', 'Groceries', { body: { fields } });
        state.groceries.push(created);
        renderGroceryList();
      } catch (err) {
        console.error(err);
        toast('Add failed');
      }
    }
    document.getElementById('grocery-add-btn').addEventListener('click', addGroceryItem);
    document.getElementById('grocery-new-item').addEventListener('keydown', e => { if (e.key === 'Enter') addGroceryItem(); });

    renderGroceryFilters();
    renderGroceryList();

    // Family messages — needs a Messages table (Text, Author) in Airtable to sync.
    // Until AIRTABLE_TABLE_IDS.Messages is set, this shows a setup notice instead of posting.
    function renderMessages() {
      const wrap = document.getElementById('message-list');
      if (!AIRTABLE_TABLE_IDS.Messages) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">💬</div><div class="empty-title">Not set up yet</div>Add a Messages table in Airtable, then ask Claude to finish wiring it up.</div>`;
        return;
      }
      if (state.messages.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">💬</div><div class="empty-title">No messages yet</div>Leave a note above.</div>`;
        return;
      }
      const sorted = [...state.messages].reverse().sort((a, b) => (f(b, F.messages.Created) || '').localeCompare(f(a, F.messages.Created) || ''));
      wrap.innerHTML = sorted.map(m => {
        const text = f(m, F.messages.Text) || '';
        const author = f(m, F.messages.Author) || '';
        const created = f(m, F.messages.Created);
        const dateLabel = created ? (() => { const d = parseISODate(created); return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`; })() : '';
        const meta = [author, dateLabel].filter(Boolean).join(' · ');
        return `
          <div class="grocery-item" style="align-items:flex-start">
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;color:var(--ink)">${escapeHtml(text)}</div>
              ${meta ? `<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted);margin-top:3px">${escapeHtml(meta)}</div>` : ''}
            </div>
            <button class="grocery-item-delete" data-action="message-delete" data-item-id="${m.id}" aria-label="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        `;
      }).join('');
      wrap.querySelectorAll('[data-action="message-delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteMessage(btn.dataset.itemId));
      });
    }

    async function postMessage() {
      const input = document.getElementById('message-new-text');
      const authorSel = document.getElementById('message-author');
      const text = input.value.trim();
      if (!text) return;
      if (!AIRTABLE_TABLE_IDS.Messages) { toast('Messages table not set up yet'); return; }
      input.value = '';
      const fields = { [F.messages.Text]: text, [F.messages.Created]: toISODate(today()) };
      if (authorSel.value) fields[F.messages.Author] = authorSel.value;
      try {
        const created = await api('POST', 'Messages', { body: { fields } });
        state.messages.push(created);
        renderMessages();
      } catch (err) {
        console.error(err);
        toast('Post failed');
      }
    }

    function deleteMessage(id) {
      scheduleUndoableDelete({
        getArray: () => state.messages,
        setArray: (arr) => { state.messages = arr; },
        id,
        render: renderMessages,
        deleteApi: () => api('DELETE', 'Messages', { id }),
        label: 'Message',
      });
    }

    document.getElementById('message-add-btn').addEventListener('click', postMessage);
    document.getElementById('message-new-text').addEventListener('keydown', e => { if (e.key === 'Enter') postMessage(); });
    renderMessages();

    function renderDashboardEvents() {
      const start = today();
      const items = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start.getTime() + i * DAY_MS);
        eventsForDate(d).forEach(e => items.push(e));
      }
      const wrap = document.getElementById('dashboard-events');
      if (items.length === 0) {
        wrap.innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><div class="empty-title">Nothing this week</div></div>`;
        return;
      }
      wrap.innerHTML = items.map(upcomingItem).join('');
    }

    function renderAll() {
      renderChoreFilters();
      renderTasks();
      renderCalendar();
      renderGroceryFilters();
      renderGroceryList();
      renderDashboardEvents();
      renderMessages();
    }

    let pollTimer;
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (document.visibilityState === 'visible') loadAll();
      }, POLL_MS);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        loadAll();
        if (state.currentPage === 'groceries') refreshGroceriesOnly();
      }
    });

    // Lightweight refresh (Groceries table only) so two people shopping at the same
    // time see each other's checked-off items in ~seconds instead of waiting on the
    // full 15s sync of every table.
    async function refreshGroceriesOnly() {
      try {
        state.groceries = await listAll('Groceries');
        renderGroceryList();
      } catch (err) {
        console.error(err);
      }
    }
    let groceryFastPollTimer;
    function startGroceryFastPolling() {
      if (groceryFastPollTimer) clearInterval(groceryFastPollTimer);
      groceryFastPollTimer = setInterval(() => {
        if (document.visibilityState === 'visible' && state.currentPage === 'groceries') {
          refreshGroceriesOnly();
        }
      }, GROCERY_FAST_POLL_MS);
    }

    function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(s) { return escapeHtml(s); }

    loadAll().then(() => { startPolling(); startGroceryFastPolling(); });
  </script>
</body>
</html>
